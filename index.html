// Chart range slider and mobile sheet swipe handlers are defined once near the end of this script.
// =====================================================================
//  📈 最大漲幅排行榜 — 追蹤 ETF 持股從新增到出清期間的最大漲幅
//  資料來源：GitHub stock_price_cache.json
// =====================================================================

let _mgAllResults   = null;   // 全部計算結果快取
let _mgLoading      = false;  // 防止重複點擊
const _priceCache   = {};     // { "code|startDate|endDate": priceArray }

// ── GitHub 股價快取（唯一資料來源）────────────────────────────────────────
const STOCK_PRICE_CACHE_URL = `${ETF_DATA_BASE_URL}/stock_price_cache.json`;
let _stockPriceCache   = null;
let _stockCachePromise = null;

// ── 二分搜尋索引（取代 .filter() 線性掃描，約 7x 加速）────────────────────
const _priceIndex = {};

function _buildPriceIndex(code, prices) {
  _priceIndex[code] = prices.map(p => p.date);
}

function _bisectLeft(arr, val) {
  let lo = 0, hi = arr.length;
  while (lo < hi) { const mid = (lo + hi) >> 1; arr[mid] < val ? lo = mid + 1 : hi = mid; }
  return lo;
}

function _bisectRight(arr, val) {
  let lo = 0, hi = arr.length;
  while (lo < hi) { const mid = (lo + hi) >> 1; arr[mid] <= val ? lo = mid + 1 : hi = mid; }
  return lo;
}

function _getPriceSlice(code, startDate, endDate) {
  const prices = _stockPriceCache?.data?.[code]?.prices;
  if (!prices?.length) return null;
  if (!_priceIndex[code]) _buildPriceIndex(code, prices);
  const idx = _priceIndex[code];
  const l = _bisectLeft(idx, startDate);
  const r = _bisectRight(idx, endDate);
  const slice = prices.slice(l, r);
  return slice.length ? slice : null;
}

async function _loadStockPriceCache() {
  if (_stockPriceCache) return _stockPriceCache;
  if (_stockCachePromise) return _stockCachePromise;
  _stockCachePromise = _fetchJsonWithBrowserCache(STOCK_PRICE_CACHE_URL)
    .then(data => {
      _stockPriceCache = data;
      // 預建所有股票的二分搜尋索引
      for (const [code, info] of Object.entries(data?.data || {})) {
        if (info?.prices?.length) _buildPriceIndex(code, info.prices);
      }
      const el = document.getElementById('cacheUpdateTime');
      if (el && data?.updated_at) el.textContent = '股價快取：' + data.updated_at.slice(0,16).replace('T',' ');
      return data;
    })
    .catch(e => { console.error('[Cache] 載入失敗：', e.message); return null; });
  return _stockCachePromise;
}

// 從 cache 取指定股票、日期區間的 K 線（同步版，cache 已預載）
function _getPricesFromCache(code, startDate, endDate) {
  const end = endDate || new Date().toISOString().slice(0, 10);
  return _getPriceSlice(code, startDate, end);
}


// ── 工具函式 ──────────────────────────────────────────────────────────
function _mgToISO(d) {
  // 日期格式為 "2026/03/12"，直接替換 / 為 -
  return String(d).replace(/\//g, '-');
}

function _mgDays(d1, d2) {
  // d1, d2 already converted to "YYYY-MM-DD" by _mgToISO
  return Math.round((new Date(d2) - new Date(d1)) / 86400000);
}

// ── 1. 從 stockData 萃取所有持股區間 ─────────────────────────────────
//   邏輯：
//   - 第一筆 count>0 的 record → 買進日（初始追蹤起點）
//   - status === '新增'  → 再次納入（前次出清後重新買進）
//   - status === '出清'  → 完全清倉，記錄一段持股區間
//   - 最後一筆 count>0 且無出清 → 仍持有中
// ─────────────────────────────────────────────────────────────────────
function _mgExtractPeriods() {
  const periods = [];
  for (const [code, info] of Object.entries(stockData)) {
    // 實際資料鍵名是 etf_holdings（底線版本）
    if (!info.etf_holdings) continue;
    for (const [etf, etfInfo] of Object.entries(info.etf_holdings)) {
      const hist = etfInfo.history;
      if (!hist || !hist.length) continue;
      let buyDate = null;
      let cycleHistory = [];

      for (const rec of hist) {
        if (rec.status === '出清' || rec.status === '刪除') {
          if (buyDate) {
            periods.push({
              code, name: info.name,
              etf, etfName: etfInfo.etf_name || etf,
              buyDate, sellDate: rec.date, holdStatus: '已出清',
              history: [...cycleHistory, rec]
            });
          }
          buyDate = null;
          cycleHistory = [];
        } else if (rec.status === '首次出現' || rec.status === '新增') {
          // 首次出現 = 新納入（含出清後再度買進的情況）。
          // 若資料來源在持有期間重複標記「新增」，仍保留為同一持倉週期。
          if (!buyDate) { buyDate = rec.date; cycleHistory = [rec]; }
          else cycleHistory.push(rec);
        } else if (!buyDate && rec.count > 0) {
          // 前幾筆無 首次出現 狀態時，取第一筆 count>0 作為起點
          buyDate = rec.date;
          cycleHistory = [rec];
        } else if (buyDate) {
          cycleHistory.push(rec);
        }
      }

      if (buyDate) {
        const lastRec = hist[hist.length - 1];
        // 持有中條件：
        //   1. 最後一筆不是出清/刪除
        //   2. count > 0
        //   3. 非「殘量」：剩餘張數 >= 該週期峰值的 1%（避免 3056→8 這種誤判）
        const isActiveSell = lastRec.status === '出清' || lastRec.status === '刪除';
        if (!isActiveSell && (lastRec.count ?? 0) > 0) {
          // 計算本週期峰值
          const cycleStart = hist.findIndex(r => r.date === buyDate);
          const cycleHist  = cycleStart >= 0 ? hist.slice(cycleStart) : hist;
          const peakCount  = Math.max(...cycleHist.map(r => r.count ?? 0));
          const residualRatio = peakCount > 0 ? (lastRec.count ?? 0) / peakCount : 1;
          if (residualRatio >= 0.01) {
            // 正常持有
            periods.push({
              code, name: info.name,
              etf, etfName: etfInfo.etf_name || etf,
              buyDate, sellDate: null, holdStatus: '持有中', history: cycleHistory
            });
          } else {
            // 殘量視同出清：用最後一筆日期作為賣出日
            periods.push({
              code, name: info.name,
              etf, etfName: etfInfo.etf_name || etf,
              buyDate, sellDate: lastRec.date, holdStatus: '已出清', history: cycleHistory
            });
          }
        }
      }
    }
  }
  return periods;
}

// 將持股異動轉為交易：首次出現/新增以當日持有張數買入；其後以 count_change 為準。
// 數量單位為「張」，價格為每股；兩者在報酬率計算中同比例，無須另行換算。
function _mgTransactionQuantity(rec, previousCount) {
  const count = Number(rec.count ?? 0);
  if (rec.status === '首次出現' || rec.status === '新增') return Math.max(0, count);
  const changed = Number(rec.count_change ?? rec.countchange);
  return Number.isFinite(changed) ? changed : count - previousCount;
}

function _mgPriceAtOrAfter(prices, date) {
  return prices.find(p => p.date >= date && Number(p.close ?? p.open) > 0) || null;
}

function _mgPriceAtOrBefore(prices, date) {
  for (let i = prices.length - 1; i >= 0; i--) {
    const p = prices[i];
    if (p.date <= date && Number(p.close ?? p.open) > 0) return p;
  }
  return null;
}

// 以逐日實際加減碼和當天收盤價建立現金流：
// 正數為買進成本、負數為賣出收入；尚未出清部位以最新收盤價市值化。
function _mgCalculateActualReturn(period, prices, endISO) {
  if (!period?.history?.length || !prices?.length) return null;
  let previousCount = 0;
  let positionQty = 0, positionCost = 0;
  let totalBoughtQty = 0, totalBuyCost = 0, totalSellValue = 0;
  let firstBuyPrice = null, firstBuyDate = null;

  for (const rec of period.history) {
    const qtyDelta = _mgTransactionQuantity(rec, previousCount);
    previousCount = Number(rec.count ?? previousCount);
    if (!qtyDelta) continue;
    const priceRec = _mgPriceAtOrAfter(prices, _mgToISO(rec.date));
    const price = Number(priceRec?.close ?? priceRec?.open);
    if (!Number.isFinite(price) || price <= 0) continue;

    if (qtyDelta > 0) {
      const cost = qtyDelta * price;
      positionQty += qtyDelta;
      positionCost += cost;
      totalBoughtQty += qtyDelta;
      totalBuyCost += cost;
      if (firstBuyPrice == null) { firstBuyPrice = price; firstBuyDate = priceRec.date; }
    } else if (positionQty > 0) {
      const soldQty = Math.min(Math.abs(qtyDelta), positionQty);
      totalSellValue += soldQty * price;
      positionCost -= (positionCost / positionQty) * soldQty; // 加權平均成本法
      positionQty -= soldQty;
      if (positionQty < 1e-8) { positionQty = 0; positionCost = 0; }
    }
  }

  const endRec = _mgPriceAtOrBefore(prices, endISO);
  const endPrice = Number(endRec?.close ?? endRec?.open);
  const marketValue = positionQty > 0 && Number.isFinite(endPrice) ? positionQty * endPrice : 0;
  if (!totalBuyCost || !firstBuyPrice || (positionQty > 0 && !endPrice)) return null;

  const returnPct = +((totalSellValue + marketValue - totalBuyCost) / totalBuyCost * 100).toFixed(2);
  const realizedProfit = totalSellValue - (totalBuyCost - positionCost);
  const unrealizedProfit = marketValue - positionCost;
  const realizedPct = +(realizedProfit / totalBuyCost * 100).toFixed(2);
  const unrealizedPct = +(unrealizedProfit / totalBuyCost * 100).toFixed(2);
  const holdingCost = positionQty > 0 ? positionCost / positionQty : null;
  const averageBuyPrice = totalBoughtQty ? totalBuyCost / totalBoughtQty : null;
  return {
    returnPct, positionQty, holdingCost, averageBuyPrice, totalBuyCost, totalSellValue,
    realizedProfit, unrealizedProfit, realizedPct, unrealizedPct,
    firstBuyPrice, firstBuyDate, endPrice: endPrice || null, endDate: endRec?.date || null,
    marketValue
  };
}

// ── 2. 從 GitHub 快取取價格（同步，cache 已預載）────────────────────────
function _mgFetchPrices(code, startDate, endDate) {
  const key = `${code}|${startDate}|${endDate}`;
  if (_priceCache[key] !== undefined) return _priceCache[key];
  const rows = _getPricesFromCache(code, startDate, endDate);
  _priceCache[key] = rows || [];
  return _priceCache[key];
}


// 同步版（_mgFetchPrices 已同步化）
function _mgComputeGain(period) {
  const startISO = _mgToISO(period.buyDate);
  const endISO   = period.sellDate ? _mgToISO(period.sellDate) : new Date().toISOString().slice(0, 10);
  const prices   = _mgFetchPrices(period.code, startISO, endISO);

  if (!prices?.length) return null;

  const actual = _mgCalculateActualReturn(period, prices, endISO);
  if (!actual) return null;

  const buyPrice = actual.averageBuyPrice;
  let peakPrice = buyPrice, peakDate = prices[0].date;
  for (const p of prices) {
    const hi = p.max || p.close || 0;
    if (hi > peakPrice) { peakPrice = hi; peakDate = p.date; }
  }

  const gainPct = +((peakPrice - buyPrice) / buyPrice * 100).toFixed(2);
  const days    = _mgDays(startISO, endISO);

  const currentPrice = actual.endPrice;
  const currentReturn = actual.returnPct;

  return { ...period, ...actual, buyPrice, peakPrice, gainPct, peakDate, days,
           currentPrice, currentReturn, currentDate: actual.endDate,
           holdingCost: actual.holdingCost, transactionCount: period.history.length };
}

// 最大漲幅排行在背景執行緒運算，避免手機主畫面在大量歷史資料計算時無法滑動。
function _mgWorkerSource() {
  const toISO = d => String(d).replace(/\//g, '-');
  const days = (a, b) => Math.round((new Date(b) - new Date(a)) / 86400000);
  const transactionQty = (rec, previous) => {
    const count = Number(rec.count || 0);
    if (rec.status === '首次出現' || rec.status === '新增') return Math.max(0, count);
    const changed = Number(rec.count_change ?? rec.countchange);
    return Number.isFinite(changed) ? changed : count - previous;
  };
  // Worker 僅接收 [日期, 收盤價, 最高價] 的必要欄位，避免複製整份 6MB+ 快取。
  const atOrAfter = (prices, date) => prices.find(p => p[0] >= date && Number(p[1]) > 0);
  const atOrBefore = (prices, date) => {
    for (let i = prices.length - 1; i >= 0; i--) if (prices[i][0] <= date && Number(prices[i][1]) > 0) return prices[i];
    return null;
  };
  const calculate = (period, allPrices, today) => {
    const start = toISO(period.buyDate), end = period.sellDate ? toISO(period.sellDate) : today;
    const prices = allPrices.filter(p => p[0] >= start && p[0] <= end);
    if (!prices.length) return null;
    let previous = 0, positionQty = 0, positionCost = 0, buyQty = 0, buyCost = 0, sellValue = 0;
    for (const rec of period.history || []) {
      const qty = transactionQty(rec, previous); previous = Number(rec.count ?? previous);
      if (!qty) continue;
      const priceRec = atOrAfter(prices, toISO(rec.date)); const price = Number(priceRec?.[1]);
      if (!price) continue;
      if (qty > 0) { positionQty += qty; positionCost += qty * price; buyQty += qty; buyCost += qty * price; }
      else if (positionQty > 0) { const sold = Math.min(Math.abs(qty), positionQty); sellValue += sold * price; positionCost -= positionCost / positionQty * sold; positionQty -= sold; if (positionQty < 1e-8) { positionQty = 0; positionCost = 0; } }
    }
    const endRec = atOrBefore(prices, end), endPrice = Number(endRec?.[1]), marketValue = positionQty ? positionQty * endPrice : 0;
    if (!buyCost || (positionQty && !endPrice)) return null;
    const averageBuyPrice = buyCost / buyQty, returnPct = +((sellValue + marketValue - buyCost) / buyCost * 100).toFixed(2);
    const realizedProfit = sellValue - (buyCost - positionCost), unrealizedProfit = marketValue - positionCost;
    let peakPrice = averageBuyPrice, peakDate = prices[0][0];
    for (const p of prices) { const high = p[2] || p[1] || 0; if (high > peakPrice) { peakPrice = high; peakDate = p[0]; } }
    return { code: period.code, name: period.name, etf: period.etf, etfName: period.etfName, buyDate: period.buyDate, sellDate: period.sellDate, holdStatus: period.holdStatus,
      buyPrice: averageBuyPrice, peakPrice, peakDate, gainPct: +((peakPrice - averageBuyPrice) / averageBuyPrice * 100).toFixed(2), days: days(start, end), currentPrice: endPrice || null, currentReturn: returnPct, currentDate: endRec?.[0] || null,
      positionQty, holdingCost: positionQty ? positionCost / positionQty : null, averageBuyPrice, totalBuyCost: buyCost, totalSellValue: sellValue, realizedProfit, unrealizedProfit,
      realizedPct: +(realizedProfit / buyCost * 100).toFixed(2), unrealizedPct: +(unrealizedProfit / buyCost * 100).toFixed(2), transactionCount: period.history?.length || 0 };
  };
  self.onmessage = ({ data }) => {
    const results = [], total = data.periods.length;
    data.periods.forEach((period, index) => {
      const result = calculate(period, data.priceData[period.code] || [], data.today);
      if (result) results.push(result);
      if ((index + 1) % 100 === 0 || index + 1 === total) self.postMessage({ type: 'progress', done: index + 1, total });
    });
    self.postMessage({ type: 'done', results, total });
  };
}

function _buildWorkerPriceData(periods) {
  const ranges = new Map();
  const today = new Date().toISOString().slice(0, 10);
  for (const period of periods) {
    const start = _mgToISO(period.buyDate);
    const end = period.sellDate ? _mgToISO(period.sellDate) : today;
    const range = ranges.get(period.code) || { start, end };
    range.start = range.start < start ? range.start : start;
    range.end = range.end > end ? range.end : end;
    ranges.set(period.code, range);
  }
  const compact = {};
  for (const [code, range] of ranges) {
    const prices = _getPriceSlice(code, range.start, range.end) || [];
    if (prices.length) compact[code] = prices.map(p => [p.date, Number(p.close ?? p.open), Number(p.max ?? p.close ?? p.open)]);
  }
  return compact;
}

function _mgComputeMaxGainInWorker(periods, progressEl) {
  if (!window.Worker || !_stockPriceCache?.data) return Promise.resolve(null);
  return new Promise(resolve => {
    const blobUrl = URL.createObjectURL(new Blob([`(${_mgWorkerSource.toString()})()`], { type: 'text/javascript' }));
    const worker = new Worker(blobUrl);
    const cleanup = () => { worker.terminate(); URL.revokeObjectURL(blobUrl); };
    worker.onmessage = ({ data }) => {
      if (data.type === 'progress' && progressEl) progressEl.textContent = `⏳ 背景計算中… ${data.done} / ${data.total}`;
      if (data.type === 'done') { cleanup(); resolve(data); }
    };
    worker.onerror = () => { cleanup(); resolve(null); };
    worker.postMessage({ periods, priceData: _buildWorkerPriceData(periods), today: new Date().toISOString().slice(0, 10) });
  });
}

// ── 4. 主載入函式（BATCH 20，按股票分群，requestIdleCallback）──────────
async function startLoadMaxGain() {
  if (_mgLoading) return;
  _mgLoading = true;

  const btn    = document.getElementById('mgLoadBtn');
  const el     = document.getElementById('maxGainContent');
  if (!btn || !el) { _mgLoading = false; return; }
  btn.disabled    = true;
  btn.textContent = '⏳ 載入中，請稍候...';
  const bannerEl  = document.getElementById('mgBanner');
  if (bannerEl) bannerEl.innerHTML = '';

  Object.keys(_priceCache).forEach(k => delete _priceCache[k]);
  _mgAllResults = null;

  // 排行才需要完整持股週期與股價快取。
  try { await _ensureStockData(); }
  catch (error) { el.textContent = '持股歷史載入失敗，請稍後再試'; btn.disabled = false; _mgLoading = false; return; }

  // 預載 GitHub cache（含預建二分搜尋索引）
  await _loadStockPriceCache();

  const periods = _mgExtractPeriods();
  const total   = periods.length;
  const results = [];

  el.innerHTML = `<div class="no-data" id="mgProgress">⏳ 從 GitHub 快取載入… 0 / ${total}</div>`;
  const workerResult = await _mgComputeMaxGainInWorker(periods, document.getElementById('mgProgress'));
  if (workerResult) {
    _finishMaxGain(workerResult.results, workerResult.total, bannerEl, btn);
    return;
  }

  // 不支援 Worker 的舊瀏覽器使用分批主執行緒計算作為 fallback。
  const grouped = {};
  for (const p of periods) (grouped[p.code] = grouped[p.code] || []).push(p);
  const groupEntries = Object.entries(grouped);
  const BATCH = 20;
  let done = 0;

  const processBatch = (start) => {
    const end = Math.min(start + BATCH, groupEntries.length);
    for (let i = start; i < end; i++) {
      const [, ps] = groupEntries[i];
      for (const p of ps) {
        const r = _mgComputeGain(p);
        if (r) results.push(r);
        done++;
      }
    }
    const prog = document.getElementById('mgProgress');
    if (prog) prog.innerHTML = `⏳ 從 GitHub 快取載入… ${Math.min(done, total)} / ${total}`;

    if (end < groupEntries.length) {
      if (window.requestIdleCallback) {
        requestIdleCallback(() => processBatch(end), { timeout: 500 });
      } else {
        setTimeout(() => processBatch(end), 0);
      }
    } else {
      _finishMaxGain(results, total, bannerEl, btn);
    }
  };

  processBatch(0);
}

function _finishMaxGain(results, total, bannerEl, btn) {
  const noData = total - results.length;
  if (noData > 0 && bannerEl) {
    bannerEl.innerHTML = `<div style="background:#FEF9C3;border:1.5px solid #FDE047;border-radius:10px;
      padding:12px 16px;margin-bottom:12px;font-size:0.87em;color:#854D0E;">
      ℹ️ 共 <b>${total}</b> 筆區間，<b>${results.length}</b> 筆有快取資料，
      <b>${noData}</b> 筆無資料（股票未收錄於 stock_price_cache.json）
    </div>`;
  }

  results.sort((a, b) => b.gainPct - a.gainPct);
  _mgAllResults = results;
  _mgBuildETFOptions(results);

  // 預設顯示「持有中」：若持有中筆數 > 9，自動切換
  const holdingCount = results.filter(r => r.holdStatus === '持有中').length;
  const statusSel    = document.getElementById('mgFilterStatus');
  if (statusSel && holdingCount > 9) {
    statusSel.value = '持有中';
  } else if (statusSel) {
    statusSel.value = 'ALL';
  }

  applyMaxGainFilter();

  btn.disabled    = false;
  btn.textContent = '🔄 載入 / 重新計算排行';
  _mgLoading      = false;
}

function clearMaxGainCache() {
  _mgAllResults  = null;
  _stockPriceCache = null;
  _stockCachePromise = null;
  Object.keys(_priceCache).forEach(k => delete _priceCache[k]);
  document.getElementById('maxGainContent').innerHTML =
    '<div class="no-data">🗑️ 已清除快取，請點擊「載入排行」重新計算</div>';
  document.getElementById('mgCount').textContent = '';
  const be = document.getElementById('mgBanner');
  if (be) be.innerHTML = '';
}


// ── 5. 套用篩選（含關鍵字搜尋）─────────────────────────────────────
function applyMaxGainFilter() {
  if (!_mgAllResults) return;
  const etfVal = document.getElementById('mgFilterETF').value;
  const staVal = document.getElementById('mgFilterStatus').value;
  const kw     = (document.getElementById('mgSearchInput')?.value || '').trim().toLowerCase();
  let data = _mgAllResults;
  if (etfVal !== 'ALL') data = data.filter(r => r.etf === etfVal);
  if (staVal !== 'ALL') data = data.filter(r => r.holdStatus === staVal);
  if (kw) data = data.filter(r =>
    r.code.toLowerCase().includes(kw) || (r.name || '').toLowerCase().includes(kw)
  );
  _mgRenderTable(data);
}

function _mgBuildETFOptions(data) {
  const sel = document.getElementById('mgFilterETF');
  // 只顯示每日異動的四檔 ETF，並加上代號縮寫
  sel.innerHTML = `<option value="ALL">全部 ETF</option>` +
    ETF_ORDER.map(e => {
      const name = ETF_SHORT_NAMES[e] || getShortName(e, e);
      return `<option value="${e}">${e} ${name}</option>`;
    }).join('');
}

// ── 6. 渲染排行表格 ────────────────────────────────────────────────────
function _mgRenderTable(data) {
  const el = document.getElementById('maxGainContent');
  const mgCount = document.getElementById('mgCount');
  if (!data || !data.length) {
    const kw = (document.getElementById('mgSearchInput')?.value || '').trim();
    const isFiltered = document.getElementById('mgFilterETF')?.value !== 'ALL' ||
                       document.getElementById('mgFilterStatus')?.value !== 'ALL' || kw;
    el.innerHTML = isFiltered
      ? '<div class="no-data">篩選條件下無符合資料，請調整篩選條件</div>'
      : '<div class="no-data">⚠️ 無法取得股價資料，請確認 stock_price_cache.json 已包含此股票</div>';
    if (mgCount) mgCount.textContent = '';
    return;
  }

  // ── 排序狀態（持久化於 window）────────────────────────────────────
  if (!window._mgSortCol) window._mgSortCol = 'gainPct';
  if (!window._mgSortDir) window._mgSortDir = -1; // -1=desc, 1=asc

  function sortData(arr) {
    const col = window._mgSortCol, dir = window._mgSortDir;
    return [...arr].sort((a, b) => {
      let av, bv;
      switch (col) {
        case 'code':      av = a.code||'';        bv = b.code||'';        return av.localeCompare(bv) * dir;
        case 'etf':       av = a.etf||'';         bv = b.etf||'';         return av.localeCompare(bv) * dir;
        case 'buyDate':   av = a.buyDate||'';      bv = b.buyDate||'';     return av.localeCompare(bv) * dir;
        case 'sellDate':  av = a.sellDate||'9999'; bv = b.sellDate||'9999';return av.localeCompare(bv) * dir;
        case 'buyPrice':  av = a.buyPrice||0;      bv = b.buyPrice||0;     return (av-bv)*dir;
        case 'peakPrice': av = a.peakPrice||0;     bv = b.peakPrice||0;    return (av-bv)*dir;
        case 'gainPct':   av = a.gainPct??-9999;   bv = b.gainPct??-9999;  return (av-bv)*dir;
        case 'days':      av = a.days||0;          bv = b.days||0;         return (av-bv)*dir;
        case 'currentReturn': av = a.currentReturn??-9999; bv = b.currentReturn??-9999; return (av-bv)*dir;
        default: return 0;
      }
    });
  }

  // ── 統計摘要（用原始 data 計算，不受排序影響）──────────────────────
  const totalCount  = data.length;
  const winCount    = data.filter(r => r.gainPct >= 0).length;
  const winRate     = totalCount ? Math.round(winCount / totalCount * 100) : 0;
  const avgGain     = totalCount ? (data.reduce((s,r)=>s+r.gainPct,0)/totalCount).toFixed(1) : 0;
  const soldCount   = data.filter(r => r.holdStatus === '已出清').length;
  const holdCount   = data.filter(r => r.holdStatus === '持有中').length;
  const positiveAvg = (() => {
    const pos = data.filter(r => r.gainPct > 0);
    return pos.length ? (pos.reduce((s,r)=>s+r.gainPct,0)/pos.length).toFixed(1) : null;
  })();

  if (mgCount) mgCount.textContent = `共 ${totalCount} 筆持股區間`;

  const statsHTML = `
  <div class="mg-stats-bar">
    <div class="mg-stat-card">
      <div class="mg-sc-label">📊 總持股區間</div>
      <div class="mg-sc-value">${totalCount}</div>
    </div>
    <div class="mg-stat-card">
      <div class="mg-sc-label">🏆 勝率（漲幅≥0）</div>
      <div class="mg-sc-value ${winRate>=60?'green':winRate>=40?'orange':'red'}">${winRate}%</div>
    </div>
    <div class="mg-stat-card">
      <div class="mg-sc-label">📈 平均最大漲幅</div>
      <div class="mg-sc-value ${avgGain>=0?'green':'red'}">${avgGain>=0?'+':''}${avgGain}%</div>
    </div>
    <div class="mg-stat-card">
      <div class="mg-sc-label">🔥 正報酬平均</div>
      <div class="mg-sc-value green">${positiveAvg !== null ? '+'+positiveAvg+'%' : '—'}</div>
    </div>
    <div class="mg-stat-card">
      <div class="mg-sc-label">✅ 持有中 / 📤 已出清</div>
      <div class="mg-sc-value" style="font-size:16px"><span style="color:#059669">${holdCount}</span> / <span style="color:#E11D48">${soldCount}</span></div>
    </div>
  </div>`;

  // ── 分頁 ───────────────────────────────────────────────────────────
  const PAGE_SIZE = 30;
  let _mgPage = window._mgPage || 0;

  function sortArrow(col) {
    if (window._mgSortCol !== col) return '<span style="opacity:0.3;font-size:10px;margin-left:2px">⇅</span>';
    return window._mgSortDir > 0
      ? '<span style="font-size:10px;margin-left:2px">▲</span>'
      : '<span style="font-size:10px;margin-left:2px">▼</span>';
  }

  function thStyle(col) {
    const active = window._mgSortCol === col;
    return `cursor:pointer;user-select:none;white-space:nowrap;${active ? 'background:#1d4ed8;' : ''}`;
  }

  function buildTableHTML(sorted, pageOffset) {
    const leftRows = sorted.map((item, i) => {
      const rank = pageOffset + i;
      const medal = rank===0?'🥇':rank===1?'🥈':rank===2?'🥉':`${rank+1}`;
      return `<tr onclick="showStockDetail('${item.code}','${item.etf}')" style="cursor:pointer">
        <td style="text-align:center;font-weight:800;padding:10px 4px;width:36px;min-width:36px;max-width:36px">${medal}</td>
        <td style="padding:10px 6px;max-width:0;overflow:hidden">
          <div style="font-weight:800;color:var(--text);font-size:0.92em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${item.code}</div>
          <div style="font-size:0.72em;color:var(--text-muted,#5B7A95);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${item.name||''}</div>
        </td>
      </tr>`;
    }).join('');

    const rightRows = sorted.map(item => {
      const sign = item.gainPct >= 0 ? '+' : '';
      let gainColor = 'var(--danger,#E11D48)';
      if (item.gainPct >= 50) gainColor = '#ff4500';
      else if (item.gainPct >= 0) gainColor = '#059669';
      const statusBadge = item.holdStatus === '持有中'
        ? `<span style="background:rgba(5,150,105,0.12);color:#059669;border-radius:6px;padding:2px 6px;font-size:0.78em;font-weight:700;white-space:nowrap">✅持有</span>`
        : `<span style="background:rgba(225,29,72,0.1);color:#E11D48;border-radius:6px;padding:2px 6px;font-size:0.78em;font-weight:700;white-space:nowrap">📤出清</span>`;
      const sellDisplay = item.sellDate
        ? `<div style="font-size:0.82em;line-height:1.3">${item.sellDate}</div><div style="margin-top:2px">${statusBadge}</div>`
        : statusBadge;
      const retHTML = item.currentReturn != null ? (() => {
        const c = item.currentReturn >= 0 ? '#059669' : '#E11D48';
        const s = item.currentReturn >= 0 ? '+' : '';
        const tag = item.holdStatus !== '持有中'
          ? `<div style="font-size:0.68em;color:#94a3b8;font-weight:600">出清時</div>` : '';
        return `${tag}<span style="color:${c}">${s}${item.currentReturn}%</span>`;
      })() : '<span style="color:var(--text-muted,#5B7A95)">—</span>';

      return `<tr onclick="showStockDetail('${item.code}','${item.etf}')" style="cursor:pointer">
        <td style="padding:9px 7px"><span style="background:var(--bg-light,#EFF6FF);border-radius:6px;padding:3px 7px;font-size:0.82em;font-weight:700;white-space:nowrap">${getShortName(item.etf,item.etfName)}</span></td>
        <td style="font-size:0.85em;padding:9px 7px">${item.buyDate}</td>
        <td style="padding:9px 7px">${sellDisplay}</td>
        <td style="font-size:0.88em;color:var(--text-muted,#5B7A95);padding:9px 7px">${item.buyPrice?.toFixed?.(2) ?? '—'}</td>
        <td style="padding:9px 7px"><div style="font-weight:700;font-size:0.9em">${item.peakPrice}</div><div style="font-size:0.7em;color:var(--text-muted,#5B7A95)">${item.peakDate}</div></td>
        <td style="font-weight:900;font-size:1.1em;color:${gainColor};padding:9px 7px;white-space:nowrap">${sign}${item.gainPct}%</td>
        <td style="font-size:0.82em;color:var(--text-muted,#5B7A95);padding:9px 7px">${item.days}天</td>
        <td style="padding:9px 7px;font-weight:700;white-space:nowrap">${retHTML}</td>
      </tr>`;
    }).join('');

    return { leftRows, rightRows };
  }

  function buildPaginationHTML(current, total) {
    if (total <= 1) return '';
    let btns = `<button class="mg-page-btn" ${current===0?'disabled':''} onclick="_mgGoPage(${current-1})">‹ 上頁</button>`;
    const start = Math.max(0, current - 2);
    const end   = Math.min(total - 1, current + 2);
    if (start > 0) btns += `<button class="mg-page-btn" onclick="_mgGoPage(0)">1</button>${start>1?'<span class="mg-page-info">…</span>':''}`;
    for (let i = start; i <= end; i++)
      btns += `<button class="mg-page-btn${i===current?' active':''}" onclick="_mgGoPage(${i})">${i+1}</button>`;
    if (end < total-1) btns += `${end<total-2?'<span class="mg-page-info">…</span>':''}<button class="mg-page-btn" onclick="_mgGoPage(${total-1})">${total}</button>`;
    btns += `<button class="mg-page-btn" ${current===total-1?'disabled':''} onclick="_mgGoPage(${current+1})">下頁 ›</button>`;
    btns += `<span class="mg-page-info">${current+1} / ${total} 頁（每頁 ${PAGE_SIZE} 筆）</span>`;
    return `<div class="mg-pagination">${btns}</div>`;
  }

  function renderPage(page) {
    _mgPage = page;
    window._mgPage = page;
    const sorted   = sortData(data);
    const pageData = sorted.slice(page * PAGE_SIZE, (page + 1) * PAGE_SIZE);
    const totalPages = Math.ceil(data.length / PAGE_SIZE);
    const { leftRows, rightRows } = buildTableHTML(pageData, page * PAGE_SIZE);

    const leftHead = `
      <table class="rk-left-table">
        <thead><tr>
          <th style="text-align:center;width:36px;min-width:36px;max-width:36px;padding:9px 4px;cursor:pointer" onclick="_mgSort('gainPct')">#</th>
          <th style="text-align:left;padding:9px 6px;${thStyle('code')}" onclick="_mgSort('code')">股票 ${sortArrow('code')}</th>
        </tr></thead>
        <tbody>${leftRows}</tbody>
      </table>`;

    const rightHead = `
      <table class="rk-right-table">
        <thead><tr>
          <th style="${thStyle('etf')}" onclick="_mgSort('etf')">ETF ${sortArrow('etf')}</th>
          <th style="${thStyle('buyDate')}" onclick="_mgSort('buyDate')">買進日 ${sortArrow('buyDate')}</th>
          <th style="${thStyle('sellDate')}" onclick="_mgSort('sellDate')">出清/狀態 ${sortArrow('sellDate')}</th>
          <th style="${thStyle('buyPrice')}" onclick="_mgSort('buyPrice')">加權買進成本 ${sortArrow('buyPrice')}</th>
          <th style="${thStyle('peakPrice')}" onclick="_mgSort('peakPrice')">最高價 ${sortArrow('peakPrice')}</th>
          <th style="${thStyle('gainPct')}" onclick="_mgSort('gainPct')">最大漲幅 ${sortArrow('gainPct')}</th>
          <th style="${thStyle('days')}" onclick="_mgSort('days')">天數 ${sortArrow('days')}</th>
          <th style="${thStyle('currentReturn')}" onclick="_mgSort('currentReturn')">當前報酬率 ${sortArrow('currentReturn')}</th>
        </tr></thead>
        <tbody>${rightRows}</tbody>
      </table>`;

    el.innerHTML = statsHTML + `
      <div class="rk-wrap">
        <div class="rk-left">${leftHead}</div>
        <div class="rk-right">${rightHead}</div>
      </div>
      <p style="margin-top:10px;font-size:0.76em;color:var(--text-muted,#5B7A95)">
        ⚠️ 加權買進成本依各次買進張數與當日收盤價計算；出清報酬率亦納入各次賣出日收盤價。最高價為持股期間每日最高峰值。<br>
        💡 點擊欄位標題即可排序，再次點擊切換升/降冪。
      </p>
      ${buildPaginationHTML(page, totalPages)}`;

    triggerSync('#maxGainContent .rk-left', '#maxGainContent .rk-right');
    if (page > 0) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  // ── 全域方法 ──────────────────────────────────────────────────────
  window._mgGoPage = (p) => {
    const totalPages = Math.ceil(data.length / PAGE_SIZE);
    if (p >= 0 && p < totalPages) renderPage(p);
  };
  window._mgSort = (col) => {
    if (window._mgSortCol === col) window._mgSortDir *= -1;
    else { window._mgSortCol = col; window._mgSortDir = -1; }
    window._mgPage = 0;
    renderPage(0);
  };
  window._mgCurrentData = data;

  renderPage(_mgPage);
}

async function _modalLoadReturn(stockCode, etf, canvasId) {
  if (!document.getElementById('retVal_' + canvasId)) return;

  try {
    const cycles = _mgExtractPeriods().filter(p => p.code === stockCode && p.etf === etf);
    if (!cycles.length) {
      const el = document.getElementById('retVal_' + canvasId);
      if (el) el.innerHTML = '<span style="font-size:0.75em;color:#64748b">查無買進紀錄</span>';
      return;
    }

    const lastCycle = cycles[cycles.length - 1];
    const isSold = lastCycle.holdStatus !== '持有中';
    const endDateISO = lastCycle.sellDate ? _mgToISO(lastCycle.sellDate) : new Date().toISOString().slice(0, 10);
    const retLabel   = isSold ? '持有期間漲幅' : '目前報酬率';

    const ghData = await _loadStockPriceCache();

    const valEl = document.getElementById('retVal_' + canvasId);
    const subEl = document.getElementById('retSub_' + canvasId);
    const lblEl = document.getElementById('retCard_' + canvasId)?.querySelector('.label');
    if (!valEl) return;  // modal 已關閉

    if (lblEl) lblEl.textContent = retLabel;

    const prices = ghData?.data?.[stockCode]?.prices;
    if (!prices?.length) {
      valEl.innerHTML = '<span style="font-size:0.75em;color:#64748b">此股票無股價快取資料</span>';
      return;
    }

    const actual = _mgCalculateActualReturn(lastCycle, prices, endDateISO);
    if (!actual) {
      valEl.innerHTML = '<span style="font-size:0.75em;color:#64748b">快取中找不到對應日期</span>';
      return;
    }

    const costBasis = isSold ? actual.firstBuyPrice : actual.holdingCost;
    const ret   = costBasis > 0 && actual.endPrice > 0
      ? +((actual.endPrice - costBasis) / costBasis * 100).toFixed(2)
      : null;
    if (ret == null) {
      valEl.innerHTML = '<span style="font-size:0.75em;color:#64748b">快取中找不到對應價格</span>';
      return;
    }
    const sign  = ret >= 0 ? '+' : '';
    const color = ret >= 0 ? '#059669' : '#E11D48';
    valEl.innerHTML = `<span style="color:${color};font-weight:900;font-size:1.05em">${sign}${ret}%</span>`;
    if (subEl) subEl.innerHTML = isSold
      ? `<span class="ret-info-line">加權成本 <b>${actual.averageBuyPrice.toFixed(2)}</b></span><span class="ret-info-line">結束收盤 <b>${actual.endPrice.toFixed(2)}</b></span>`
      : `<span class="ret-info-line">加權成本 <b>${actual.holdingCost.toFixed(2)}</b></span><span class="ret-info-line">最新收盤 <b>${actual.endPrice.toFixed(2)}</b></span>`;

  } catch (err) {
    console.error('[_modalLoadReturn]', err);
    const valEl = document.getElementById('retVal_' + canvasId);
    if (valEl) valEl.innerHTML = '<span style="font-size:0.72em;color:#E11D48">⚠️ ' + err.message + '</span>';
  }
}

  document.body.style.animationPlayState = state;

(function detectLowEnd() {
  const lowMem = navigator.deviceMemory != null && navigator.deviceMemory < 2;
  const lowCPU = navigator.hardwareConcurrency != null && navigator.hardwareConcurrency <= 2;
  if (lowMem || lowCPU) document.documentElement.classList.add('low-end');
})();

function closeStockModal(modal){
  if(!modal) return;
  if(modal._abort) modal._abort.abort();
  chartInstances.forEach((chart,id)=>{if(modal.querySelector('#'+id)){chart.destroy();chartInstances.delete(id);}});
  modal.remove();
}
function initSheetSwipe(modal){
  const content=modal.querySelector('.modal-content'), bar=content?.querySelector('.sheet-drag-bar'); if(!bar) return;
  const controller=new AbortController(); modal._abort=controller; const {signal}=controller;
  let startY=0,curY=0,dragging=false;
  bar.addEventListener('touchstart',e=>{startY=e.touches[0].clientY;curY=startY;dragging=true;content.style.transition='none';},{passive:true,signal});
  document.addEventListener('touchmove',e=>{if(!dragging)return;curY=e.touches[0].clientY;content.style.transform=`translateY(${Math.max(0,curY-startY)}px)`;},{passive:true,signal});
  document.addEventListener('touchend',()=>{if(!dragging)return;dragging=false;content.style.transition='';if(curY-startY>100)closeStockModal(modal);else content.style.transform='';},{signal});
}
function addChartRangeSlider(canvasId,chart,labels){
 const canvas=document.getElementById(canvasId),container=canvas?.closest('.chart-container');if(!container||labels.length<=10)return;
 const old=container.querySelector('.rs-wrap');if(old){old._abort?.abort();old.remove();} const n=labels.length,win=Math.min(Math.max(Math.round(n*.35),15),60);let L=(n-win)/n,R=1,drag=null,startL=0,startR=0,startF=0;const ctl=new AbortController(),sig=ctl.signal;
 const wrap=document.createElement('div');wrap.className='rs-wrap';wrap._abort=ctl;wrap.innerHTML='<div class="rs-dates"><span></span><span></span></div><div class="rs-hint">◀ 左右拖曳縮放 · 中段拖曳平移 ▶</div><div class="rs-track"><div class="rs-track-bg"></div><div class="rs-fill"></div><div class="rs-thumb"><span class="rs-thumb-icon">◀▶</span></div><div class="rs-thumb"><span class="rs-thumb-icon">◀▶</span></div></div>';container.appendChild(wrap);
 const [dl,dr]=wrap.querySelectorAll('.rs-dates span'),track=wrap.querySelector('.rs-track'),bg=wrap.querySelector('.rs-track-bg'),fill=wrap.querySelector('.rs-fill'),[tl,tr]=wrap.querySelectorAll('.rs-thumb'); const idx=p=>Math.min(n-1,Math.max(0,Math.round(p*(n-1)))), frac=e=>{const r=track.getBoundingClientRect();return Math.min(1,Math.max(0,(e.clientX-r.left-10)/(r.width-20)))};
 const draw=()=>{const w=track.getBoundingClientRect().width-20,a=10+L*w,b=10+R*w;tl.style.left=a+'px';tr.style.left=b+'px';fill.style.left=a+'px';fill.style.width=(b-a)+'px';dl.textContent=labels[idx(L)]||'';dr.textContent=labels[idx(R)]||'';chart.options.scales.x.min=labels[idx(L)];chart.options.scales.x.max=labels[idx(R)];chart.update('none')};
 const start=(type,e)=>{e.preventDefault();drag=type;startF=frac(e);startL=L;startR=R};[[tl,'L'],[tr,'R'],[fill,'P']].forEach(([el,type])=>el.addEventListener('pointerdown',e=>{el.setPointerCapture?.(e.pointerId);start(type,e)},{signal:sig}));
 document.addEventListener('pointermove',e=>{if(!drag)return;const f=frac(e),gap=2/(n-1);if(drag==='L')L=Math.min(R-gap,Math.max(0,f));else if(drag==='R')R=Math.max(L+gap,Math.min(1,f));else{const w=startR-startL;L=Math.min(1-w,Math.max(0,startL+f-startF));R=L+w}draw()},{signal:sig});document.addEventListener('pointerup',()=>drag=null,{signal:sig});bg.addEventListener('pointerdown',e=>{const w=R-L;L=Math.max(0,Math.min(1-w,frac(e)-w/2));R=L+w;draw()},{signal:sig});draw();
}
