<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>主動式ETF雷達</title>
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<!-- 圖表僅用於個股彈窗；defer 避免阻塞 HTML 解析 -->
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8/hammer.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800;900&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --primary:#0369A1;--primary-light:#0EA5E9;--secondary:#06B6D4;--accent:#F59E0B;
  --success:#059669;--danger:#E11D48;--warning:#D97706;--dark:#0A1628;
  --text:#0F2840;--text-light:#5B7A95;--bg-light:#EFF6FF;--white:#FFFFFF;
  --border:#BAD4EA;--shadow:rgba(3,105,161,0.12);
  --gold:#C9930A;--navy:#071428;--teal:#0891B2
}
@keyframes gradientFlow{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}

body{font-family:'Noto Sans TC','DM Sans',-apple-system,BlinkMacSystemFont,"Microsoft JhengHei","PingFang TC",sans-serif;
  background:linear-gradient(-45deg,#071428 0%,#0D2744 30%,#0A3A5C 60%,#052238 100%);background-size:400% 400%;
  animation:gradientFlow 18s ease infinite;color:var(--text);min-height:100vh;line-height:1.6;font-size:16px;
  background-attachment:fixed}

/* Loading */
.loading-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:linear-gradient(-45deg,#071428 0%,#0D2744 30%,#0A3A5C 60%,#052238 100%);
  background-size:400% 400%;animation:gradientFlow 18s ease infinite;z-index:9999;
  display:flex;flex-direction:column;justify-content:center;align-items:center}
.loading-spinner{width:52px;height:52px;border:3px solid rgba(14,165,233,0.2);
  border-top:3px solid #0EA5E9;border-radius:50%;animation:spin 0.8s linear infinite;
  box-shadow:0 0 20px rgba(14,165,233,0.3)}
.loading-text{margin-top:22px;font-size:16px;color:rgba(255,255,255,0.8);font-weight:600;letter-spacing:2px}

/* Hero */
.hero-header{
  background:linear-gradient(135deg,#071428 0%,#0D2A4A 50%,#0A3358 100%);
  padding:36px 28px 32px;text-align:center;
  border-bottom:1px solid rgba(14,165,233,0.25);
  position:relative;overflow:hidden}
.hero-header::before{content:"";position:absolute;top:0;left:0;right:0;bottom:0;
  background:radial-gradient(ellipse 60% 80% at 50% -10%,rgba(14,165,233,0.18) 0%,transparent 70%);
  pointer-events:none}
.hero-header::after{content:"";position:absolute;bottom:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,#0EA5E9,#06B6D4,#0EA5E9,transparent)}
.hero-title{font-size:30px;font-weight:900;color:#FFFFFF;margin-bottom:12px;letter-spacing:-0.5px;
  display:flex;align-items:center;justify-content:center;gap:12px;position:relative}
.hero-title-text{background:linear-gradient(135deg,#FFFFFF 0%,#93C5FD 50%,#67E8F9 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero-icon{font-size:34px;animation:float 3s ease-in-out infinite;filter:drop-shadow(0 0 10px rgba(14,165,233,0.5))}
.hero-subtitle{font-size:13px;color:rgba(148,198,231,0.85);margin-bottom:18px;font-weight:600;letter-spacing:3px;text-transform:uppercase;position:relative}
.hero-date{display:inline-block;background:rgba(14,165,233,0.15);border:1px solid rgba(14,165,233,0.4);
  color:#7DD3FC;padding:9px 22px;border-radius:20px;font-size:13px;font-weight:700;
  backdrop-filter:blur(10px);letter-spacing:0.5px;position:relative}

/* Container */
.container{max-width:1400px;margin:0 auto;padding:0 20px 40px}

/* Main tabs desktop */
.main-tabs-container{background:rgba(255,255,255,0.97);backdrop-filter:blur(20px);
  margin:20px 20px 0;border-radius:20px;box-shadow:0 4px 24px rgba(0,0,0,0.18),0 1px 0 rgba(14,165,233,0.3);overflow:hidden;
  border:1px solid rgba(14,165,233,0.15)}
.main-tabs{display:flex;padding:12px;gap:8px;overflow-x:auto;scrollbar-width:none}
.main-tabs::-webkit-scrollbar{display:none}
.main-tab{flex:1;min-width:130px;padding:15px 20px;background:transparent;border:none;cursor:pointer;
  color:var(--text-light);font-size:14px;font-weight:700;border-radius:12px;
  transition:all 0.3s cubic-bezier(0.4,0,0.2,1);white-space:nowrap;
  display:flex;align-items:center;justify-content:center;gap:8px;font-family:inherit;letter-spacing:0.3px}
.main-tab:hover{background:var(--bg-light);color:var(--primary);transform:translateY(-2px)}
.main-tab.active{background:linear-gradient(135deg,#0369A1 0%,#0891B2 100%);
  color:white;box-shadow:0 6px 20px rgba(3,105,161,0.35)}
.main-tab .tab-icon{font-size:18px}

/* Mobile nav 2x3 */
.mobile-nav-grid{display:none;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 10px}
.mobile-nav-card{background:rgba(255,255,255,0.97);backdrop-filter:blur(10px);border-radius:18px;
  padding:22px 12px;text-align:center;cursor:pointer;
  transition:all 0.3s cubic-bezier(0.4,0,0.2,1);border:1px solid rgba(14,165,233,0.2);
  box-shadow:0 4px 16px rgba(0,0,0,0.15)}
.mobile-nav-card:hover{transform:translateY(-6px);box-shadow:0 12px 36px rgba(3,105,161,0.25);border-color:#0EA5E9}
.mobile-nav-card.active{background:linear-gradient(135deg,#0369A1 0%,#0891B2 100%);
  border-color:transparent;box-shadow:0 12px 36px rgba(3,105,161,0.4)}
.mobile-nav-card.active .mobile-nav-icon{transform:scale(1.1)}
.mobile-nav-card.active .mobile-nav-label{color:white}
.mobile-nav-icon{font-size:38px;margin-bottom:10px;transition:transform 0.3s;display:block}
.mobile-nav-label{font-size:13px;font-weight:700;color:var(--text);transition:color 0.3s;letter-spacing:0.3px}

/* Content sections */
.content-section{background:rgba(255,255,255,0.98);backdrop-filter:blur(20px);
  border-radius:20px;padding:32px;box-shadow:0 4px 24px rgba(0,0,0,0.15),0 1px 0 rgba(14,165,233,0.2);
  margin:20px;border:1px solid rgba(14,165,233,0.12);contain:layout style}
.content-section.hidden{display:none}

/* ETF Tabs */
.etf-tabs{display:flex;gap:10px;margin-bottom:24px;padding-bottom:20px;border-bottom:2px solid var(--border);flex-wrap:wrap;justify-content:center}
.etf-tab{background:var(--bg-light);border:1.5px solid var(--border);cursor:pointer;color:var(--text-light);
  font-size:14px;padding:12px 24px;border-radius:10px;transition:all 0.3s;font-weight:700;font-family:inherit;letter-spacing:0.3px}
.etf-tab:hover{background:white;border-color:#0EA5E9;color:var(--primary);transform:translateY(-2px);box-shadow:0 4px 12px rgba(3,105,161,0.15)}
.etf-tab.active{background:linear-gradient(135deg,#0369A1,#0891B2);border-color:transparent;color:white;box-shadow:0 6px 18px rgba(3,105,161,0.3)}

/* Week nav */
.week-nav{display:flex;gap:12px;margin-bottom:24px;padding:18px;background:#EFF6FF;
  border-radius:16px;flex-wrap:wrap;align-items:center;justify-content:center;border:1px solid rgba(14,165,233,0.2)}
.week-range{font-size:18px;font-weight:800;color:#0369A1;flex:1;min-width:200px;text-align:center}
.week-btn{background:white;border:1.5px solid #0369A1;color:#0369A1;
  padding:12px 24px;border-radius:10px;cursor:pointer;font-weight:700;font-size:14px;font-family:inherit;
  transition:all 0.3s;white-space:nowrap}
.week-btn:hover:not(:disabled){background:#0369A1;color:white;transform:translateY(-2px);box-shadow:0 6px 18px rgba(3,105,161,0.3)}
.week-btn:disabled{opacity:0.3;cursor:not-allowed}
.week-btn.latest{background:#059669;border-color:#059669;color:white}
.week-btn.latest:hover:not(:disabled){background:#047857;box-shadow:0 6px 18px rgba(5,150,105,0.4)}


/* 決策儀表板：先辨識跨 ETF 共識，再閱讀週曆細節 */
.daily-dashboard{margin:0 0 22px;padding:22px;border:1px solid rgba(14,165,233,.24);border-radius:18px;background:linear-gradient(135deg,#f0f9ff,#eff6ff 55%,#f8fafc)}
.dd-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}.dd-title{margin:0;font-size:21px;font-weight:900;color:var(--text)}.dd-sub{margin:3px 0 0;color:var(--text-light);font-size:13px;font-weight:600}.dd-date{background:var(--primary);color:#fff;border-radius:99px;padding:6px 11px;font-size:12px;font-weight:800;white-space:nowrap}
.dd-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-bottom:15px}.dd-stat{background:rgba(255,255,255,.9);border:1px solid var(--border);border-radius:12px;padding:12px 14px}.dd-stat small{display:block;color:var(--text-light);font-size:11px;font-weight:800}.dd-stat strong{font-size:24px;line-height:1.25;color:var(--text)}.dd-stat strong.add{color:var(--success)}.dd-stat strong.del{color:var(--danger)}
.dd-toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:11px}.dd-filters{display:flex;gap:7px;flex-wrap:wrap}.dd-filter{cursor:pointer;border:1px solid var(--border);background:#fff;color:var(--text-light);padding:6px 10px;border-radius:9px;font:700 12px inherit}.dd-filter.active{background:var(--primary);border-color:var(--primary);color:#fff}.dd-sort{color:var(--text-light);font-size:12px;font-weight:700}
.dd-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:10px}.dd-card{width:100%;text-align:left;font:inherit;cursor:pointer;border:1px solid var(--border);background:#fff;border-radius:12px;padding:13px;transition:.18s}.dd-card:hover{transform:translateY(-2px);border-color:var(--primary-light);box-shadow:0 5px 15px var(--shadow)}.dd-card-top{display:flex;align-items:center;justify-content:space-between;gap:8px}.dd-code{font-weight:900;color:var(--text);font-size:15px}.dd-name{font-weight:600;color:var(--text-light);font-size:13px;margin-left:5px}.dd-score{font-size:11px;font-weight:800;color:var(--primary);background:var(--bg-light);padding:3px 7px;border-radius:99px}.dd-meta{margin-top:7px;font-size:12px;color:var(--text-light);font-weight:600}.dd-meta b{color:var(--text)}.dd-badge{display:inline-block;margin-top:8px;font-size:11px;font-weight:800;padding:3px 7px;border-radius:6px}.dd-badge.add{color:var(--success);background:rgba(5,150,105,.1)}.dd-badge.del{color:var(--danger);background:rgba(225,29,72,.1)}.dd-empty{grid-column:1/-1;text-align:center;color:var(--text-light);padding:18px;font-size:13px}
@media(max-width:768px){.daily-dashboard{padding:15px;margin-bottom:16px}.dd-title{font-size:18px}.dd-sub{font-size:11px}.dd-date{font-size:11px}.dd-stats{gap:7px}.dd-stat{padding:10px 8px}.dd-stat strong{font-size:20px}.dd-toolbar{align-items:flex-start;flex-direction:column;gap:8px}.dd-list{grid-template-columns:1fr}.dd-card{padding:12px}.dd-sort{display:none}}

/* Calendar */
.calendar-table{width:100%;border-collapse:separate;border-spacing:0;border-radius:16px;overflow:hidden;box-shadow:0 4px 20px var(--shadow)}
.calendar-table th{background:linear-gradient(135deg,#0369A1,#0891B2);color:white;padding:16px 12px;font-size:15px;font-weight:700;text-align:center;letter-spacing:0.5px}
.calendar-table td{padding:18px 14px;border:1px solid var(--border);vertical-align:top;min-width:170px;background:white;transition:background 0.3s}
.calendar-table td:hover{background:#F0F7FF}
.calendar-table td.today-marker{background:linear-gradient(135deg,#FEF3C7 0%,#FDE68A 100%);border:2px solid var(--warning);position:relative}
.calendar-table td.today-marker::before{content:"今日";position:absolute;top:6px;right:6px;background:var(--warning);color:white;font-size:11px;padding:5px 12px;border-radius:8px;font-weight:700}

/* Mobile calendar */
.mobile-calendar{display:none}
.mobile-day-card{background:white;border-radius:16px;padding:22px;margin-bottom:16px;border:2px solid var(--border);box-shadow:0 4px 12px var(--shadow)}
.mobile-day-card.today-marker{background:linear-gradient(135deg,#FEF3C7 0%,#FDE68A 100%);border-color:var(--warning)}
.mobile-day-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding-bottom:14px;border-bottom:2px solid var(--border)}
.mobile-day-title{font-size:22px;font-weight:900;color:var(--text)}
.mobile-day-date{font-size:15px;color:var(--text-light);font-weight:600}
.mobile-today-badge{background:var(--warning);color:white;padding:7px 16px;border-radius:12px;font-size:13px;font-weight:800}

/* Change sections */
.change-section{margin-bottom:14px}
.change-section-title{font-size:15px;font-weight:800;margin-bottom:12px;padding:10px 14px;border-radius:10px;display:flex;align-items:center;gap:8px}
.change-section-title.new{color:var(--success);background:rgba(16,185,129,0.1);border-left:4px solid var(--success)}
.change-section-title.delete{color:var(--danger);background:rgba(239,68,68,0.1);border-left:4px solid var(--danger)}
.stock-mini-list{display:flex;flex-direction:column;gap:8px}
.stock-mini-item{background:var(--bg-light);padding:12px 16px;border-radius:10px;cursor:pointer;
  transition:all 0.3s;border-left:3px solid transparent;display:flex;align-items:center}
.stock-mini-item:hover{background:white;transform:translateX(4px);box-shadow:0 4px 12px var(--shadow)}
.stock-mini-item.new{border-left-color:var(--success)}
.stock-mini-item.delete{border-left-color:var(--danger)}
.stock-code{font-weight:800;color:var(--text);font-size:16px}
.stock-name{color:var(--text-light);font-size:15px;margin-left:10px;font-weight:600;flex:1}
.stock-count{color:var(--success);font-weight:800;font-size:15px}

/* Changes grid */
.changes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;margin-top:20px}
.change-card{background:white;border-radius:16px;padding:22px;cursor:pointer;transition:all 0.3s;
  border:1.5px solid var(--border);position:relative;overflow:hidden}
.change-card::before{content:"";position:absolute;top:0;left:0;height:3px;width:100%;
  background:linear-gradient(90deg,#0369A1,#06B6D4)}
.change-card:hover{transform:translateY(-6px);box-shadow:0 12px 32px rgba(3,105,161,0.15);border-color:#0EA5E9}
.change-card.new-add{border-color:#10B981;background:linear-gradient(135deg,rgba(5,150,105,0.04) 0%,white 50%)}
.change-card.new-add::before{background:linear-gradient(90deg,#059669,#10B981)}
.change-card.delete{border-color:#E11D48;background:linear-gradient(135deg,rgba(225,29,72,0.04) 0%,white 50%)}
.change-card.delete::before{background:linear-gradient(90deg,#E11D48,#FB7185)}
.change-card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;padding-bottom:14px;border-bottom:2px solid var(--bg-light)}
.change-code{font-size:24px;font-weight:800;color:var(--text)}
.change-name{font-size:16px;color:var(--text-light);margin-top:5px;font-weight:600}
.badge{padding:7px 16px;border-radius:10px;font-size:12px;font-weight:800;text-transform:uppercase}
.badge.new{background:var(--success);color:white}
.badge.delete{background:var(--danger);color:white}
.change-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.stat-item{background:var(--bg-light);padding:14px;border-radius:10px}
.stat-label{font-size:11px;color:var(--text-light);margin-bottom:8px;text-transform:uppercase;font-weight:700}
.stat-value{font-size:22px;font-weight:800;color:var(--text)}
.stat-value.positive{color:var(--success)}
.stat-value.negative{color:var(--danger)}

/* Search */
.search-box{margin-bottom:24px}
.search-box input{width:100%;padding:17px 22px;border:1.5px solid var(--border);border-radius:14px;
  font-size:16px;transition:all 0.3s;background:white;font-weight:500;font-family:inherit}
.search-box input:focus{border-color:#0EA5E9;box-shadow:0 0 0 4px rgba(14,165,233,0.12);outline:none}

/* Date selector */
.date-selector{background:#EFF6FF;padding:26px;border-radius:16px;margin-bottom:24px;border:1px solid rgba(14,165,233,0.2)}
.date-selector h3{margin-bottom:18px;color:#0369A1;font-size:19px;font-weight:800}
.history-nav-bar{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:18px;
  padding-top:16px;border-top:2px solid var(--border);flex-wrap:wrap}
.history-nav-btn{background:white;border:1.5px solid #0369A1;color:#0369A1;
  padding:10px 24px;border-radius:10px;cursor:pointer;font-weight:700;font-size:14px;font-family:inherit;transition:all 0.25s;white-space:nowrap}
.history-nav-btn:hover:not(:disabled){background:#0369A1;color:white;transform:translateY(-2px);box-shadow:0 6px 18px rgba(3,105,161,0.3)}
.history-nav-btn:disabled{opacity:0.3;cursor:not-allowed}
.history-nav-label{font-size:15px;font-weight:800;color:#0369A1;flex:1;text-align:center;min-width:180px}
.date-controls{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end}
.date-input-group{flex:1;min-width:200px}
.date-input-group label{display:block;font-size:14px;color:var(--text);margin-bottom:10px;font-weight:700}
.date-input-group select,.date-input-group input[type=date]{width:100%;padding:14px 18px;
  border:2px solid var(--border);border-radius:12px;font-size:16px;background:white;transition:all 0.3s;font-weight:600}
.date-input-group input:focus,.date-input-group select:focus{border-color:#0EA5E9;box-shadow:0 0 0 4px rgba(14,165,233,0.12);outline:none}
.btn{padding:14px 32px;background:linear-gradient(135deg,#0369A1,#0891B2);color:white;border:none;border-radius:12px;
  cursor:pointer;font-size:15px;font-weight:700;font-family:inherit;transition:all 0.3s;box-shadow:0 6px 18px rgba(3,105,161,0.3)}
.btn:hover{background:linear-gradient(135deg,#0284C7,#06B6D4);transform:translateY(-2px);box-shadow:0 8px 24px rgba(3,105,161,0.4)}

/* Summary */
.summary-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:18px;margin-bottom:24px}
.summary-card{background:white;padding:22px;border-radius:16px;text-align:center;border:2px solid var(--border);transition:all 0.3s}
.summary-card:hover{transform:translateY(-4px);box-shadow:0 8px 24px var(--shadow);border-color:var(--primary-light)}
.summary-card .label{font-size:12px;color:var(--text-light);margin-bottom:12px;text-transform:uppercase;font-weight:800}
.summary-card .value{font-size:34px;font-weight:900;color:#0369A1}
.summary-card .value.success{color:var(--success)}
.summary-card .value.danger{color:var(--danger)}

/* Modal */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(7,20,40,0.85);
  backdrop-filter:blur(8px);z-index:1000;overflow-y:auto;padding:20px;animation:fadeIn 0.3s}
.modal-content{max-width:1100px;margin:40px auto;background:white;border-radius:24px;padding:36px;
  box-shadow:0 24px 72px rgba(0,0,0,0.35);animation:slideUp 0.4s;border:1px solid rgba(14,165,233,0.15)}
.modal-header{margin-bottom:24px;padding-bottom:18px;border-bottom:2px solid var(--border);position:relative}
.modal-header h2{color:var(--text);font-size:28px;font-weight:800;padding-right:40px}
.modal-header p{color:var(--text-light);font-size:15px;margin-top:8px}
.modal-close-btn{position:absolute;top:0;right:0;background:var(--bg-light);border:none;font-size:26px;
  color:var(--text-light);cursor:pointer;width:42px;height:42px;display:flex;align-items:center;
  justify-content:center;border-radius:10px;transition:all 0.3s}
.modal-close-btn:hover{background:var(--danger);color:white;transform:rotate(90deg)}
.modal-etf-tabs{display:flex;gap:12px;margin-bottom:22px;padding-bottom:18px;border-bottom:2px solid var(--border);flex-wrap:wrap}
.modal-etf-tab{background:var(--bg-light);border:2px solid var(--border);cursor:pointer;color:var(--text-light);
  font-size:15px;padding:12px 22px;border-radius:12px;transition:all 0.3s;font-weight:700}
.modal-etf-tab:hover{background:white;border-color:#0EA5E9;color:#0369A1}
.modal-etf-tab.active{background:linear-gradient(135deg,#0369A1,#0891B2);border-color:transparent;color:white}
.modal-etf-tab.active span{color:rgba(255,255,255,0.92)!important;background:rgba(255,255,255,0.18)!important}
.modal-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;margin-bottom:22px;align-items:stretch}
.modal-stat-card{background:var(--bg-light);padding:18px;border-radius:12px;text-align:center;border:2px solid var(--border);display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:120px}

.modal-stat-card .value.danger{color:var(--danger)}
.modal-stat-card .value.primary{color:var(--primary)}
.modal-stat-card .sub{font-size:13px;color:var(--text-light);margin-top:8px;font-weight:600}

/* Chart container + zoom */
.chart-container{background:var(--bg-light);border-radius:16px;padding:24px;margin-bottom:26px;position:relative}
.chart-container h3{font-size:20px;font-weight:800;margin-bottom:18px;color:var(--text)}

  color:white;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;
  transition:all 0.2s;opacity:0.8}
.reset-zoom-btn:hover{opacity:1;transform:translateY(-1px)}

/* ── Dual-handle range slider ── */
.rs-wrap{margin-top:16px;padding:0 2px;user-select:none;-webkit-user-select:none}
.rs-dates{display:flex;justify-content:space-between;font-size:11px;color:#0369A1;

.rs-hint{text-align:center;font-size:11px;color:var(--text-light);margin-bottom:8px;font-weight:500}
.rs-track{position:relative;height:40px;display:flex;align-items:center;padding:0 10px;cursor:pointer}
.rs-track-bg{position:absolute;left:10px;right:10px;height:6px;background:var(--border);border-radius:3px}
.rs-fill{position:absolute;height:6px;background:linear-gradient(90deg,#0369A1,#06B6D4);
  border-radius:3px;cursor:grab;transition:opacity 0.15s}
.rs-fill:hover{opacity:0.85}
.rs-fill:active{cursor:grabbing}
.rs-thumb{position:absolute;width:22px;height:22px;background:white;
  border:3px solid #0369A1;border-radius:50%;cursor:grab;
  box-shadow:0 2px 8px rgba(3,105,161,0.25);transform:translateX(-50%);
  z-index:3;transition:box-shadow 0.15s,border-color 0.15s;top:50%;margin-top:-11px}

<script>
// ── 雙表格列高同步（全域共用）──────────────────────────────────────
function syncDualTable(leftSel, rightSel) {
  // 同步 tbody 列高（雙 rAF 批次讀寫，避免 forced layout）
  const sync = (lSel, rSel) => {
    const lRows = Array.from(document.querySelectorAll(lSel));
    const rRows = Array.from(document.querySelectorAll(rSel));
    if (!lRows.length || !rRows.length) return;
    lRows.forEach(r => { r.style.height = ''; });
    rRows.forEach(r => { r.style.height = ''; });
    requestAnimationFrame(() => {
      const heights = lRows.map((lr, i) => rRows[i]
        ? Math.max(lr.getBoundingClientRect().height, rRows[i].getBoundingClientRect().height) : 0);
      requestAnimationFrame(() => {
        heights.forEach((h, i) => {
          if (h > 0) { lRows[i].style.height = h + 'px'; if (rRows[i]) rRows[i].style.height = h + 'px'; }
        });
      });
    });
  };
  sync(leftSel + ' thead tr', rightSel + ' thead tr');
  sync(leftSel + ' tbody tr', rightSel + ' tbody tr');
}
function triggerSync(leftSel, rightSel) {
  // 兩次觸發：DOM 掛載後 + 字型/圖片載入後
  [0, 200].forEach(ms =>
    setTimeout(() => syncDualTable(leftSel, rightSel), ms)
  );
}

let stockData, processedData, rankingData, homepageIndex, dataManifest;
let stockSearchIndex = [];
let allDates = [];
let currentETF = null, currentMode = 'dashboard';
let dashboardETF = null, currentWeekOffset = 0;
let chartInstances = new Map();
let latestDataDate = null;
let _stockDataPromise = null;

// 同一個兩小時區間內，直接使用瀏覽器 Cache Storage 的 JSON；
// 避免每次開啟網站都重新下載大型歷史與股價檔案。
const BROWSER_CACHE_NAME = 'active-etf-radar-v2';
const BROWSER_CACHE_BUCKETS_TO_KEEP = 2;

function _browserCacheKey(url) {
  const hour = new Date().getUTCHours();
  const bucket = new Date().toISOString().slice(0, 10) + 'T' + String(Math.floor(hour / 2) * 2).padStart(2, '0');
  return `${url}${url.includes('?') ? '&' : '?'}_cache_bucket=${bucket}`;
}

async function _pruneBrowserCache(cache) {
  const groups = new Map();
  for (const request of await cache.keys()) {
    const parsed = new URL(request.url);
    const bucket = parsed.searchParams.get('_cache_bucket');
    if (!bucket) continue;
    parsed.searchParams.delete('_cache_bucket');
    const group = parsed.toString();
    (groups.get(group) || groups.set(group, []).get(group)).push({ request, bucket });
  }
  await Promise.all([...groups.values()].flatMap(entries => entries
    .sort((a, b) => b.bucket.localeCompare(a.bucket))
    .slice(BROWSER_CACHE_BUCKETS_TO_KEEP)
    .map(({ request }) => cache.delete(request))));
}

async function _fetchJsonWithBrowserCache(url) {
  if (!('caches' in window)) {
    const response = await fetch(url);
    if (!response.ok) throw new Error(`${url.split('/').pop()}: HTTP ${response.status}`);
    return response.json();
  }
  // 升版時移除舊快取，並且每種資料只保留最近兩個兩小時區間。
  await Promise.all((await caches.keys())
    .filter(name => name.startsWith('active-etf-radar-') && name !== BROWSER_CACHE_NAME)
    .map(name => caches.delete(name)));
  const cache = await caches.open(BROWSER_CACHE_NAME);
  const cacheKey = _browserCacheKey(url);
  const cached = await cache.match(cacheKey);
  if (cached) { _pruneBrowserCache(cache); return cached.json(); }
  const response = await fetch(url);
  if (!response.ok) throw new Error(`${url.split('/').pop()}: HTTP ${response.status}`);
  await cache.put(cacheKey, response.clone());
  _pruneBrowserCache(cache);
  return response.json();
}

// ===== ETF 短名稱對照表 =====
const ETF_SHORT_NAMES = {
  '00980A':'野村智慧優選','00981A':'統一台股增長','00982A':'群益精選強棒','00992A':'群益科技創新',
  '00983A':'中信ARK創新','00984A':'安聯台灣高息','00985A':'野村台灣50','00986A':'台新龍頭成長',
  '00987A':'台新優勢成長','00988A':'統一全球創新','00989A':'摩根美國科技','00990A':'元大AI新經濟',
  '00991A':'復華未來50',  '00993A':'安聯台灣',    '00994A':'第一金台股優','00995A':'中信台灣卓越',
  '00996A':'兆豐台灣豐收','00997A':'群益美國增長','00998A':'復華金融股息','00999A':'野村台灣高息',
  '00400A':'國泰動能高息','00401A':'摩根台灣鑫收','00403A':'統一升級50','00407A':'凱基主動',
};
function getShortName(code, fallback){
  if(ETF_SHORT_NAMES[code]) return ETF_SHORT_NAMES[code];
  // 去掉「主動」前綴 & 常見冗長後綴
  if(!fallback) return code;
  return fallback
    .replace(/^主動/,'')
    .replace(/主動式ETF基金$/,'').replace(/主動式ETF$/,'').replace(/主動ETF$/,'')
    .replace(/主動式台灣/,'台灣').trim();
}


// ── 預建日期索引（加速 getChangesForDate，O(n)→O(1)）────────────────
let _dateChangeIndex = null;
let _dailySignalCache = new Map();
let _dailyDashboardFilter = 'all';

function _buildDateChangeIndex() {
  _dateChangeIndex = {};
  _dailySignalCache.clear();
  for (const [stockCode, stockInfo] of Object.entries(stockData)) {
    for (const [etf, etfInfo] of Object.entries(stockInfo.etf_holdings || {})) {
      for (const record of etfInfo.history || []) {
        const dateStr = normalizeDate(record.date);
        const delta = Number(record.count_change ?? record.countchange ?? 0);
        const lifecycle = (record.status === '新增' || record.status === '首次出現') ? 'new'
          : (record.status === '出清' || record.status === '刪除') ? 'deleted' : null;
        const movement = delta > 0 ? 'add' : delta < 0 ? 'reduce' : null;
        if (!lifecycle && !movement) continue;
        const day = _dateChangeIndex[dateStr] ||= {};
        const entry = day[etf] ||= [];
        entry.push({ code: stockCode, name: stockInfo.name, count: record.count, weight: record.weight,
          count_change: delta, weight_change: record.weight_change, date: dateStr, status: record.status });
      }
    }
  }
}

function _getChangeBucket(dateStr, etf) {
  const source = _dateChangeIndex?.[dateStr]?.[etf];
  // 相容於舊快取的分類格式，也支援新版「每筆只存一次」格式。
  if (!Array.isArray(source)) return source || { new: [], deleted: [], add: [], reduce: [], all: [] };
  const bucket = { new: [], deleted: [], add: [], reduce: [], all: source };
  for (const item of source) {
    const delta = Number(item.count_change ?? item.countChange ?? 0);
    if (item.status === '新增' || item.status === '首次出現') bucket.new.push(item);
    else if (item.status === '出清' || item.status === '刪除') bucket.deleted.push(item);
    else if (delta > 0) bucket.add.push(item);
    else if (delta < 0) bucket.reduce.push(item);
  }
  return bucket;
}

function _setFullStockData(data) {
  stockData = data;
  stockSearchIndex = Object.entries(stockData).map(([code, info]) => ({
    code, name: info.name || '', key: (code + ' ' + (info.name || '')).toLowerCase(), holdings: info.etf_holdings
  }));
  if (homepageIndex) return;
  const dateSet = new Set();
  for (const stockItem of Object.values(stockData)) {
    for (const etfHolding of Object.values(stockItem.etf_holdings || {})) {
      for (const record of etfHolding.history || []) dateSet.add(record.date);
    }
  }
  allDates = Array.from(dateSet).map(normalizeDate).sort().reverse();
  _buildDateChangeIndex();

async function _ensureStockData() {
  if (stockData) return stockData;
  if (!_stockDataPromise) {
    _stockDataPromise = _fetchJsonWithBrowserCache(`${ETF_DATA_BASE_URL}/stock_history_data.json`)
      .then(data => { _setFullStockData(data); return data; })

}

function _applyManifestStatus(manifest) {
  if (!manifest) return;
  if (manifest.schema_version !== PUBLIC_DATA_SCHEMA_VERSION) {
    throw new Error(`資料版本不相容（網站 v${PUBLIC_DATA_SCHEMA_VERSION}／資料 v${manifest.schema_version}）`);

  // 只顯示 ETF_ORDER 中指定的 4 個 ETF

// ===== 週曆 =====
function getWeekRange(offset=0){
  if(!latestDataDate) return {start:new Date(), end:new Date(), dates:[]};
  const baseDate = new Date(latestDataDate);
  const dayOfWeek = baseDate.getDay();
  let anchor = new Date(baseDate);
  if(dayOfWeek === 6) anchor.setDate(baseDate.getDate()-1);
  else if(dayOfWeek === 0) anchor.setDate(baseDate.getDate()-2);
  const anchorDay = anchor.getDay();
  const monday = new Date(anchor);
  monday.setDate(anchor.getDate() - (anchorDay-1) + offset*7);
  const weekStart = new Date(monday);
  const weekEnd   = new Date(weekStart);
  weekEnd.setDate(weekStart.getDate()+4);
  return {start:weekStart, end:weekEnd, dates:getDatesInRange(new Date(weekStart.getTime()-86400000), weekEnd)};
}
function getDatesInRange(start, end){
  const dates = []; let current = new Date(start);
  current.setDate(current.getDate()+1);
  while(current <= end){
    const day = current.getDay();
    if(day !== 0 && day !== 6) dates.push(new Date(current));
    current.setDate(current.getDate()+1);
  }
  return dates;
}
function formatDate(date){
  if(!date) return '';
  const year = date.getFullYear();
  const month = String(date.getMonth()+1).padStart(2,'0');
  const day   = String(date.getDate()).padStart(2,'0');
  return `${year}${month}${day}`;
}
function getDayName(date){ return ['日','一','二','三','四','五','六'][date.getDay()]; }
function normalizeDate(d){ return d ? d.replace(/[\/\-]/g,'') : ''; }

function getChangesForDate(dateStr, etf) {
  // O(1) 索引查詢（索引建立後使用）
  if (_dateChangeIndex) {
    return _getChangeBucket(dateStr, etf);
  }
  // fallback：索引尚未建立時線性掃描
  const newStocks = [], deletedStocks = [];
  for (const [stockCode, stockInfo] of Object.entries(stockData)) {
    const etfInfo = stockInfo.etf_holdings?.[etf];
    if (!etfInfo?.history) continue;
    const record = etfInfo.history.find(r => normalizeDate(r.date) === dateStr);
    if (!record) continue;
    if (record.status === '新增' || record.status === '首次出現')
      newStocks.push({ code: stockCode, name: stockInfo.name, count: record.count, date: dateStr });
    else if (record.status === '出清' || record.status === '刪除')
      deletedStocks.push({ code: stockCode, name: stockInfo.name, date: dateStr });
  }
  return { new: newStocks, deleted: deletedStocks };
}


function getChangeDisplayStatus(record, countChange){
  const cc=Number(countChange ?? record?.count_change ?? record?.countchange ?? 0);
  // 首次出現與出清是生命週期事件；其餘所有正負張數變化應一律顯示加碼／減碼。
  if(record?.status === '首次出現' && cc >= 0) return '首次出現';
  if((record?.status === '出清' || record?.status === '刪除') && cc <= 0) return '出清';
  if(cc > 0) return '加碼';
  if(cc < 0) return '減碼';
  return record?.status || '無變動';
}

function renderUnifiedChanges(targetDate){
  if(targetDate) {
    // normalise to YYYY-MM-DD for <input type="date">
    const td = String(targetDate).replace(/\//g,'-').replace(/-/g,'');
    const fmtd = td.length===8 ? td.slice(0,4)+'-'+td.slice(4,6)+'-'+td.slice(6,8) : targetDate.replace(/\//g,'-');
    document.getElementById('changesDate').value = fmtd;

  const selectedETF  = currentETF;
  if(!selectedDate){ document.getElementById('changesGrid').innerHTML='<p class="no-data">請選擇日期</p>'; return; }
  const formattedDate = selectedDate.replace(/-/g,'');
  updateChangeETFTabReminders(formattedDate);
  const dateIndex = allDates.indexOf(formattedDate);
  if(dateIndex === -1){
    const inputTs = new Date(selectedDate).getTime();
    let closest = allDates[0], minDiff = Infinity;
    for(const d of allDates){ const diff = Math.abs(new Date(d.replace(/(\d{4})(\d{2})(\d{2})/,'$1-$2-$3')).getTime()-inputTs); if(diff<minDiff){minDiff=diff;closest=d;} }
    document.getElementById('changesGrid').innerHTML=`<p class="no-data">${formattedDate} 無資料，自動跳至 ${closest}</p>`;
    setTimeout(()=>renderUnifiedChanges(closest),250); return;
  }
  const navBar = document.getElementById('changesNavBar');
  navBar.style.display = 'flex';
  document.getElementById('changesNavLabel').textContent = `${formattedDate}  (第 ${dateIndex+1} / ${allDates.length} 筆)`;
  document.getElementById('changesPrevBtn').disabled = dateIndex >= allDates.length-1;
  document.getElementById('changesNextBtn').disabled = dateIndex <= 0;
  const indexedChanges = _getChangeBucket(formattedDate, selectedETF).all;
  const changes = indexedChanges
    ? indexedChanges.map(record => ({ ...record, display_status: getChangeDisplayStatus(record, record.count_change) }))
    : [];
  // 異動查詢改為直接呈現清單，不顯示容易造成干擾的分類統計卡。
  const changesSummary = document.getElementById('changesSummary');
  if (changesSummary) changesSummary.innerHTML = '';
  const grid = document.getElementById('changesGrid');
  if(!changes.length){ grid.innerHTML='<p class="no-data">此日期無異動資料</p>'; return; }
  const statusOrder = {'首次出現':0,'新增':1,'加碼':2,'減碼':3,'出清':4};
  changes.sort((a,b)=>{ const so=(statusOrder[a.display_status]??9)-(statusOrder[b.display_status]??9); return so!==0?so:Math.abs(b.count_change??0)-Math.abs(a.count_change??0); });
  grid.innerHTML = changes.map(change => {
    const typeClass = (change.display_status==='首次出現'||change.display_status==='新增')?'new-add':(change.display_status==='出清')?'delete':'';
    const badgeClass = (change.display_status==='首次出現'||change.display_status==='新增')?'new':(change.display_status==='出清')?'delete':'';
    const cc = change.count_change??0, wc = change.weight_change??0;
    const ccLabel = (change.display_status==='首次出現'||change.display_status==='新增'||change.display_status==='加碼')?cc:(change.display_status==='出清'||change.display_status==='減碼')?cc:(cc>0?'+'+cc:cc);
    const wcLabel = (change.display_status==='首次出現'||change.display_status==='新增'||change.display_status==='加碼')?wc:(change.display_status==='出清'||change.display_status==='減碼')?wc:(wc>0?'+'+wc:wc);
    return `<div class="change-card ${typeClass}" onclick="showStockDetail('${change.code}','${selectedETF}')">
      <div class="change-card-header">
        <div><div class="change-code">${change.code}</div><div class="change-name">${change.name}</div></div>
        <span class="badge ${badgeClass}">${change.display_status}</span>
      </div>
      <div class="change-stats">
        <div class="stat-item"><div class="stat-label">張數</div><div class="stat-value">${change.count??'-'}</div></div>
        <div class="stat-item"><div class="stat-label">權重</div><div class="stat-value">${change.weight!=null?change.weight+'%':'-'}</div></div>
        <div class="stat-item"><div class="stat-label">張數變化</div>
          <div class="stat-value ${cc>0?'positive':cc<0?'negative':''}">${ccLabel}</div></div>
        <div class="stat-item"><div class="stat-label">權重變化</div>
          <div class="stat-value ${wc>0?'positive':wc<0?'negative':''}">${wcLabel}%</div></div>
      </div></div>`;
  }).join('');
}

let rankingSortCol = '3m', rankingSortDir = -1; // default: 3m desc

const RANKING_COLS = [
  { key:'rank', label:'排名' },
  { key:'code', label:'代碼 / 名稱' },  // code+name merged
  { key:'1d',   label:'今日' },
  { key:'1w',   label:'本週' },
  { key:'1m',   label:'本月' },
  { key:'3m',   label:'三個月' },
  { key:'6m',   label:'六個月' },
  { key:'ytd',  label:'今年' },
];
const COL_RETURN_MAP = { '1d':'return_1d','1w':'return_1w','1m':'return_1m','3m':'return_3m','6m':'return_6m','ytd':'return_ytd' };

function sortRankingBy(col){
  if(rankingSortCol === col) rankingSortDir *= -1;
  else { rankingSortCol = col; rankingSortDir = -1; }
  renderRanking();
}

function renderRanking(){
  if(!rankingData){ document.getElementById('rankingTableContainer').innerHTML='<div class="no-data">排行資料尚未載入，請稍後重新整理頁面</div>'; return; }
  // 顯示最新資料日期
  const rankDateEl = document.getElementById('rankingDateLabel');
  if (rankDateEl) {
    const dateStr = rankingData.updated_at || rankingData.as_of || rankingData.date ||
      (processedData ? processedData[Object.keys(processedData)[0]]?.latest_date : null);
    rankDateEl.textContent = dateStr ? '📅 資料日期：' + dateStr : '';
  }
  const trackedCodes = new Set(Object.keys(processedData||{}));
  const fmtRet = v => {
    if(v==null) return '<span class="return-null">--</span>';
    const cls = v>0?'return-positive':v<0?'return-negative':'';
    return `<span class="${cls}" style="font-size:1em;font-weight:800">${v>0?'+':''}${v.toFixed(2)}%</span>`;
  };
  const rankBadge = r => {
    if(!r) return '<span class="rank-badge rank-other">--</span>';
    const cls = r===1?'rank-1':r===2?'rank-2':r===3?'rank-3':'rank-other';
    return `<span class="rank-badge ${cls}">${r}</span>`;
  };
  // Sort
  const sorted = [...rankingData.ranking].sort((a,b) => {
    const col = rankingSortCol;
    if(col === 'rank'){ const av=a.rank??999, bv=b.rank??999; return (av-bv)*rankingSortDir; }
    if(col === 'code'){ return a.code.localeCompare(b.code)*rankingSortDir; }
    const field = COL_RETURN_MAP[col];
    if(field){ const av=a[field]??-9999, bv=b[field]??-9999; return (av-bv)*rankingSortDir; }
    return 0;
  });
  const sortArrow = col => {
    if(rankingSortCol!==col) return '<span style="opacity:0.35;font-size:10px">⇅</span>';
    return rankingSortDir>0 ? '<span style="font-size:10px">▲</span>' : '<span style="font-size:10px">▼</span>';
  };

  // ── 雙表格佈局：左側固定 + 右側橫向捲動 ──────────────────────────
  // 左側：排名 + 代碼/名稱（不捲動）
  let leftHead = `<table class="rk-left-table"><thead><tr>
    <th onclick="sortRankingBy('rank')" style="cursor:pointer;width:36px;min-width:36px;max-width:36px;padding:10px 4px;${rankingSortCol==='rank'?'background:#1d4ed8':''}">排名 ${sortArrow('rank')}</th>
    <th onclick="sortRankingBy('code')" style="cursor:pointer;text-align:left;padding:10px 6px;${rankingSortCol==='code'?'background:#1d4ed8':''}">代碼/名稱 ${sortArrow('code')}</th>
  </tr></thead><tbody>`;

  // 右側：各報酬欄（可橫向捲動）
  const RIGHT_COLS = [
    {key:'1d', label:'今日', field:'return_1d'},
    {key:'1w', label:'本週', field:'return_1w'},
    {key:'1m', label:'本月', field:'return_1m'},
    {key:'3m', label:'三個月', field:'return_3m'},
    {key:'6m', label:'六個月', field:'return_6m'},
    {key:'ytd', label:'今年', field:'return_ytd'},
  ];
  let rightHead = `<table class="rk-right-table"><thead><tr>`;
  for(const col of RIGHT_COLS){
    const isSorted = rankingSortCol===col.key;
    rightHead += `<th onclick="sortRankingBy('${col.key}')" style="cursor:pointer;${isSorted?'background:#1d4ed8':''}">${col.label} ${sortArrow(col.key)}</th>`;
  }
  rightHead += `</tr></thead><tbody>`;

  let leftBody = '', rightBody = '';
  for(const etf of sorted){
    const isTracked = trackedCodes.has(etf.code);
    const shortName = getShortName(etf.code, etf.name.replace(/^主動/,''));
    const trClass = isTracked ? 'rk-tracked' : 'rk-row';

    leftBody += `<tr class="${trClass}">
      <td style="text-align:center;padding:10px 4px;width:36px;min-width:36px;max-width:36px">${rankBadge(etf.rank)}</td>
      <td style="padding:10px 6px;text-align:left;max-width:0;overflow:hidden">
        <div style="font-weight:800;font-size:14px;line-height:1.4;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${etf.code}</div>
        <div style="font-size:11px;color:var(--text-muted,#5B7A95);font-weight:600;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${shortName}</div>
        ${isTracked ? '<div><span class="tracked-tag" style="margin-left:0;margin-top:3px;display:inline-block">追蹤中</span></div>' : ''}
      </td>
    </tr>`;

    rightBody += `<tr class="${trClass}">`;
    for(const col of RIGHT_COLS){
      const is3m = rankingSortCol === '3m' && col.key === '3m';
      rightBody += `<td style="${is3m ? 'font-weight:900;font-size:16px' : ''}">${fmtRet(etf[col.field])}</td>`;
    }
    rightBody += '</tr>';
  }

  const leftHtml  = leftHead  + leftBody  + `</tbody></table>`;
  const rightHtml = rightHead + rightBody + `</tbody></table>`;

  document.getElementById('rankingTableContainer').innerHTML = `
    <div class="rk-wrap" id="rkWrap">
      <div class="rk-left"  id="rkLeft">${leftHtml}</div>
      <div class="rk-right" id="rkRight">${rightHtml}</div>
    </div>`;

  // 同步左右列高
  triggerSync('#rkLeft', '#rkRight');
}

// ── 今日股價卡片（收盤價 / 漲跌幅，資料來源：GitHub 股價快取）──────────────
function _todayPriceCardHtml(stockCode, canvasId, eager = true) {
  const cacheData = _stockPriceCache?.data?.[stockCode]?.prices;
  if (cacheData && cacheData.length) {
    return _todayPriceCardResult(cacheData, canvasId);
  }
  if (eager) setTimeout(() => _modalLoadTodayPrice(stockCode, canvasId), 0);
  return '<div class="modal-stat-card" id="priceCard_' + canvasId + '">'
    + '<div class="label">今日股價</div>'
    + '<div class="value" id="priceVal_' + canvasId + '"><span style="font-size:0.65em;color:#64748b">⏳ 載入中…</span></div>'
    + '<div class="sub" id="priceSub_' + canvasId + '"></div>'
    + '</div>';
}

function _todayPriceCardResult(prices, canvasId) {
  const sorted = [...prices].sort((a, b) => a.date.localeCompare(b.date));
  const last = sorted[sorted.length - 1];
  const prev = sorted.length > 1 ? sorted[sorted.length - 2] : null;
  const close = last?.close;
  const change = (close != null && prev?.close != null) ? close - prev.close : null;
  const pct = (change != null && prev.close) ? (change / prev.close * 100) : null;
  const sign = change != null && change >= 0 ? '+' : '';
  const color = change == null ? '#64748b' : (change >= 0 ? '#059669' : '#E11D48');
  const arrow = change == null ? '' : (change >= 0 ? '▲' : '▼');
  return '<div class="modal-stat-card" id="priceCard_' + canvasId + '" data-loaded="1">'
    + '<div class="label">今日股價</div>'
    + '<div class="value" id="priceVal_' + canvasId + '">'
    + '<span style="color:' + color + ';font-weight:900;font-size:1.05em">'
    + (close != null ? close : '--') + '</span>'
    + '</div>'
    + '<div class="sub" id="priceSub_' + canvasId + '"><span class="price-change-line">'
    + (change != null
        ? '<span style="color:' + color + ';font-weight:700">' + arrow + ' ' + sign + change.toFixed(2) + ' (' + sign + pct.toFixed(2) + '%)</span>'
        : '無漲跌資料')
    + '</span><span class="price-date-line">｜' + (last?.date || '') + '</span></div>'
    + '</div>';
}

async function _modalLoadTodayPrice(stockCode, canvasId) {
  if (!document.getElementById('priceVal_' + canvasId)) return;
  try {
    const ghData = await _loadStockPriceCache();
    if (!document.getElementById('priceVal_' + canvasId)) return;
    const prices = ghData?.data?.[stockCode]?.prices;
    const cardEl = document.getElementById('priceCard_' + canvasId);
    if (!prices || !prices.length) {
      if (cardEl) cardEl.innerHTML = '<div class="label">今日股價</div><div class="value"><span style="font-size:0.75em;color:#64748b">查無股價資料</span></div>';
      return;
    }
    if (cardEl) cardEl.outerHTML = _todayPriceCardResult(prices, canvasId);
  } catch (e) {
    const el = document.getElementById('priceVal_' + canvasId);
    if (el) el.innerHTML = '<span style="font-size:0.72em;color:#E11D48">⚠️ ' + e.message + '</span>';
  }
}

// ── 持股異動表的歷史收盤價／日漲跌 ─────────────────────────────────────
async function _fillHistoryPriceColumns(stockCode, etf, canvasId) {
  try {
    const history = stockData?.[stockCode]?.etf_holdings?.[etf]?.history;
    if (!history?.length) return;
    const cache = await _loadStockPriceCache();
    const prices = cache?.data?.[stockCode]?.prices;
    if (!prices?.length) return;

    [...history].reverse().forEach((record, historyIndex) => {
      const priceCell = document.getElementById(`histPrice_${canvasId}_${historyIndex}`);
      const changeCell = document.getElementById(`histPriceChange_${canvasId}_${historyIndex}`);
      if (!priceCell && !changeCell) return;
      const targetDate = _mgToISO(record.date);
      // 正常情況使用同日收盤；遇休市或資料延遲時才取下一個交易日。
      const priceIndex = prices.findIndex(p => p.date >= targetDate && Number(p.close ?? p.open) > 0);
      const priceRec = priceIndex >= 0 ? prices[priceIndex] : null;
      const close = Number(priceRec?.close ?? priceRec?.open);
      if (!priceRec || !Number.isFinite(close)) {
        if (priceCell) priceCell.textContent = '—';
        return;
      }
      if (priceCell) {
        priceCell.textContent = close.toLocaleString('zh-TW', { maximumFractionDigits: 2 });
        if (priceRec.date !== targetDate) priceCell.title = `使用最近交易日 ${priceRec.date} 收盤價`;
      }
      const previousClose = Number(prices[priceIndex - 1]?.close ?? prices[priceIndex - 1]?.open);
      if (!changeCell || !Number.isFinite(previousClose) || previousClose === 0) return;
      const change = close - previousClose;
      const pct = change / previousClose * 100;
      const color = change > 0 ? '#059669' : change < 0 ? '#E11D48' : '#64748b';
      const sign = change > 0 ? '+' : '';
      changeCell.innerHTML = `<span style="color:${color}">${sign}${change.toFixed(2)}<br><small>(${sign}${pct.toFixed(2)}%)</small></span>`;
    });
  } catch (error) {
    console.warn('[History price columns]', error.message);
  }
}

// ── Modal 報酬率卡片 HTML（自動從快取讀取，有值直接顯示）──────────────
function _mgRetCardHtml(stockCode, etf, data, canvasId, eager = true) {
  // 用 _mgExtractCycles 邏輯判斷最新週期是否為「持有中」
  // 以「首次出現」切割週期，避免殘量（如 8 張）誤判為出清
  const hist = stockData?.[stockCode]?.etf_holdings?.[etf]?.history;
  let _isSoldCard = true; // default: sold
  if (hist && hist.length) {
    let _curBuyCard = null;
    for (const rec of hist) {
      if (rec.status === '出清' || rec.status === '刪除') {
        _curBuyCard = null;
      } else if (rec.status === '首次出現' || rec.status === '新增') {
        _curBuyCard = rec.date;
      } else if (!_curBuyCard && (rec.count ?? 0) > 0) {
        _curBuyCard = rec.date;
      }
    }
    const lastRec = hist[hist.length - 1];
    // 持有中：curBuy 有值 且 最後一筆不是出清/刪除 且 非殘量
    let _cardActive = _curBuyCard && lastRec.status !== '出清' && lastRec.status !== '刪除';
    if (_cardActive) {
      // 殘量檢查
      const _cardCycIdx = hist.findIndex(r => r.date === _curBuyCard);
      const _cardCycHist = _cardCycIdx >= 0 ? hist.slice(_cardCycIdx) : hist;
      const _cardPeak  = Math.max(..._cardCycHist.map(r => r.count ?? 0));
      const _cardRatio = _cardPeak > 0 ? (lastRec.count ?? 0) / _cardPeak : 1;
      if (_cardRatio < 0.01) _cardActive = false; // 殘量視同出清
    }
    _isSoldCard = !_cardActive;
  }
  const isSold = _isSoldCard;
  const label  = isSold ? '持有期間漲幅' : '目前報酬率';

  // 持有中以剩餘部位加權成本計算；已出清卡維持首次買進至結束日的漲幅。
  if (eager) setTimeout(() => _modalLoadReturn(stockCode, etf, canvasId), 0);
  return '<div class="modal-stat-card" id="retCard_' + canvasId + '">'
    + '<div class="label">' + label + '</div>'
    + '<div class="value" id="retVal_' + canvasId + '"><span style="font-size:0.65em;color:#64748b">⏳ 計算中…</span></div>'
    + '<div class="sub" id="retSub_' + canvasId + '"></div>'
    + '</div>';
}

function _mgHistReturnCardHtml(stockCode, etf, canvasId, eager = true) {
  const cardId = 'histRetCard_' + canvasId;
  const bodyId = 'histRetBody_' + canvasId;

  // 非同步填入（僅當前顯示分頁才立即運算，切換分頁時才觸發其餘分頁計算）

  </div>`;

async function _fillHistReturnCard(stockCode, etf, canvasId) {
  const bodyEl = document.getElementById('histRetBody_' + canvasId);
  if (!bodyEl) return;

  try {
    const cycles = _mgExtractPeriods().filter(p => p.code === stockCode && p.etf === etf);
    if (!cycles.length) {
      bodyEl.innerHTML = '<span style="font-size:0.75em;color:#94a3b8">無持股記錄</span>';
      return;
    }

    // 載入股價快取
    const ghData = await _loadStockPriceCache();
    if (!document.getElementById('histRetBody_' + canvasId)) return;

    const prices = ghData?.data?.[stockCode]?.prices;

    // 最新的在最上方
    const orderedCycles = [...cycles].reverse();

    const rows = orderedCycles.map((cycle, i) => {
      const endISO  = cycle.sellDate ? _mgToISO(cycle.sellDate) : new Date().toISOString().slice(0,10);
      const isLast  = i === orderedCycles.length - 1;
      const label = cycle.holdStatus === '持有中'
        ? '<span class="hist-ret-status" style="color:#059669;background:rgba(5,150,105,0.1)">持有中</span>'
        : '<span class="hist-ret-status" style="color:#E11D48;background:rgba(225,29,72,0.08)">已出清</span>';

      if (!prices?.length) {
        return `<div class="hist-ret-row">
          <div class="hist-ret-main"><div class="hist-ret-dates">${cycle.buyDate}${cycle.sellDate?' → '+cycle.sellDate:''}</div>
          <div class="hist-ret-meta">${label}<span>無快取</span></div></div>
        </div>`;
      }

      const actual = _mgCalculateActualReturn(cycle, prices, endISO);
      if (!actual) {
        return `<div class="hist-ret-row">
          <div class="hist-ret-main"><div class="hist-ret-dates">${cycle.buyDate}${cycle.sellDate?' → '+cycle.sellDate:''}</div>
          <div class="hist-ret-meta">${label}<span>—</span></div></div>
        </div>`;
      }

      const ret = actual.firstBuyPrice > 0 && actual.endPrice > 0
        ? +((actual.endPrice - actual.firstBuyPrice) / actual.firstBuyPrice * 100).toFixed(2)
        : null;
      const sign  = ret != null && ret >= 0 ? '+' : '';
      const color = ret == null ? '#94a3b8' : ret >= 0 ? '#059669' : '#E11D48';
      const retStr = ret != null ? `${sign}${ret}%` : '—';
      const days  = _mgDays(_mgToISO(cycle.buyDate), actual.endDate || endISO);

      return `<div class="hist-ret-row">
        <div class="hist-ret-main">
          <div class="hist-ret-dates">${cycle.buyDate}${cycle.sellDate?' → '+cycle.sellDate:''}</div>
          <div class="hist-ret-meta">${label}<span>${days}天</span></div>
        </div>
        <span class="hist-ret-value" style="color:${color}">${retStr}</span>
      </div>`;
    });

    if (!document.getElementById('histRetBody_' + canvasId)) return;
    bodyEl.innerHTML = rows.join('') || '<span style="font-size:0.8em;color:#94a3b8">無資料</span>';
    bodyEl.scrollTop = 0;

    // 顯示箭頭（若內容可捲動）
    requestAnimationFrame(() => {
      const arrowEl = document.getElementById('histRetArrow_' + canvasId);
      if (arrowEl && bodyEl.scrollHeight > bodyEl.clientHeight + 4) {
        arrowEl.style.display = 'block';
      }
    });

  } catch(e) {
    const el = document.getElementById('histRetBody_' + canvasId);
    if (el) el.innerHTML = `<span style="font-size:0.72em;color:#E11D48">⚠️ ${e.message}</span>`;
  }
}


async function showStockDetail(stockCode, preferredETF=null){
  // 首頁只載入摘要；使用者真的開啟個股時才下載完整歷史。
  if (!stockData) {
    try { await _ensureStockData(); }
    catch (error) { alert('持股明細載入失敗，請稍後再試'); return; }

  const stock = stockData[stockCode];
  if(!stock || !stock.etf_holdings){ alert('找不到股票資料'); return; }

  etfList.sort((a,b) => { const diff=(stock.etf_holdings[b].current_count??0)-(stock.etf_holdings[a].current_count??0); return diff || (ETF_ORDER.indexOf(a)-ETF_ORDER.indexOf(b)); });

    const _tabHist = data.history || [];
    let _tabIsHeld = false;
    if (_tabHist.length) {

          else if (r.status === '出清' || r.status === '刪除') _tabCycleStart = null;

        const _tabPeak = _tabCycleStart
          ? Math.max(..._tabHist.slice(_tabHist.indexOf(_tabCycleStart)).map(r => r.count ?? 0))
          : (_tabLast.count ?? 0);
        const _tabRatio = _tabPeak > 0 ? (_tabLast.count ?? 0) / _tabPeak : 1;

function switchModalETF(event, stockCode, etfCode){
  event.stopPropagation();
  document.querySelectorAll('.modal-etf-tab').forEach(tab => tab.classList.remove('active'));
  event.currentTarget.classList.add('active');
  document.querySelectorAll('.etf-content').forEach(c => c.classList.remove('active'));
  const targetContent = document.querySelector(`.etf-content[data-etf="${etfCode}"]`);
  if(targetContent) targetContent.classList.add('active');
  const stock = stockData[stockCode];
  if(stock && stock.etf_holdings[etfCode]){
    const canvasId = ('chart_'+stockCode+'_'+etfCode).replace(/[^a-zA-Z0-9]/g,'_');
    const _switchDraw = () => drawTrendChart(canvasId, stock.etf_holdings[etfCode].history);
    if (window.requestIdleCallback) {
      requestIdleCallback(_switchDraw, { timeout: 400 });
    } else {
      setTimeout(_switchDraw, 100);
    }
    // 首次切到此分頁時才觸發今日股價／報酬率／歷史進出的背景運算（避免所有分頁一次全跑）
    if (!document.getElementById('priceCard_'+canvasId)?.dataset.loaded) {
      const priceCard = document.getElementById('priceCard_'+canvasId);
      if (priceCard) priceCard.dataset.loaded = '1';
      _modalLoadTodayPrice(stockCode, canvasId);
    }
    if (!document.getElementById('retCard_'+canvasId)?.dataset.loaded) {
      const retCard = document.getElementById('retCard_'+canvasId);
      if (retCard) retCard.dataset.loaded = '1';
      _modalLoadReturn(stockCode, etfCode, canvasId);
    }
    if (!document.getElementById('histRetCard_'+canvasId)?.dataset.loaded) {
      const histCard = document.getElementById('histRetCard_'+canvasId);
      if (histCard) histCard.dataset.loaded = '1';
      _fillHistReturnCard(stockCode, etfCode, canvasId);
    }
    _fillHistoryPriceColumns(stockCode, etfCode, canvasId);
  }
}

// ===== 折線圖（含縮放/拖曳）=====
function drawTrendChart(canvasId, history){
  // 圖表函式庫 defer 載入期間不阻塞介面，完成後自動重試。
  if (typeof Chart === 'undefined') { setTimeout(() => drawTrendChart(canvasId, history), 120); return; }
  if(!history || history.length === 0) return;
  if(chartInstances.has(canvasId)) chartInstances.get(canvasId).destroy();
  const sortedHistory = [...history].sort((a,b)=>a.date.localeCompare(b.date));
  // 末尾加空白佔位點，防止最後日期標籤被右側邊界截斷
  const labels = [...sortedHistory.map(h => h.date), ''];
  const counts = [...sortedHistory.map(h => h.count), null];
  const canvas = document.getElementById(canvasId);
  if(!canvas) return;

  // 重置縮放按鈕
  const container = canvas.closest('.chart-container');
  if(container && !container.querySelector('.reset-zoom-btn')){
    const resetBtn = document.createElement('button');
    resetBtn.className = 'reset-zoom-btn';
    resetBtn.textContent = '⟳ 重置縮放';
    resetBtn.onclick = () => {
      const chart = chartInstances.get(canvasId);
      if(chart){
        chart.resetZoom();
        // Rebuild range slider to reset to full range
        const rsWrap = canvas.closest('.chart-container')?.querySelector('.rs-wrap');
        if(rsWrap){ rsWrap.remove(); }
        const sortedH = [...(chart.data.labels||[])];
        setTimeout(()=>addChartRangeSlider(canvasId, chart, sortedH), 50);
      }
    };
    container.appendChild(resetBtn);
  }

  const ctx = canvas.getContext('2d');
  // 每次更新都鎖定 0 為 Y 軸基準，避免縮放外掛／首次版面重排改寫資料範圍。
  const lockZeroBaseline = {
    id: 'lockZeroBaseline',
    afterDataLimits(chart, args) {
      if (args.scale.id === 'y') args.scale.min = 0;
    }
  };
  const newChart = new Chart(ctx, {
    type: 'line',
    plugins: [lockZeroBaseline],
    data: {
      labels,
      datasets:[{
        label:'張數', data:counts,
        borderColor:'#4F46E5', backgroundColor:'rgba(79,70,229,0.1)',
        borderWidth:3, fill:true, tension:0.4,
        pointRadius: ctx => ctx.dataIndex === counts.length-1 ? 0 : (counts.length>200 ? 1.5 : counts.length>80 ? 2.5 : 4),
        pointHitRadius: 12,
        pointBackgroundColor:'#4F46E5', pointBorderColor:'white',
        pointBorderWidth:2, pointHoverRadius:7,
      }]
    },
    options:{
      responsive:true, maintainAspectRatio:true,
      // Modal 開啟後仍可能改變 Canvas 尺寸；停用座標動畫可避免 0 點短暫停留在舊座標。
      animation:false,
      layout:{ padding:{ right:18, left:4 } },
      plugins:{
        legend:{display:false},
        tooltip:{backgroundColor:'rgba(15,23,42,0.9)',padding:12,
          titleFont:{size:14,weight:'bold'},bodyFont:{size:13},cornerRadius:8,
          callbacks:{
            title: items => items[0]?.label ?? '',
            label: item => item.parsed.y == null ? '' : `張數：${item.parsed.y}`
          }
        },
        zoom:{
          zoom:{ wheel:{enabled:true}, pinch:{enabled:true}, mode:'x' },
          pan:{ enabled:true, mode:'x' },
        },
        decimation:{
          enabled: true,
          algorithm: 'lttb',
          samples: counts.length > 300 ? 60 : counts.length > 100 ? 80 : counts.length,
          threshold: 60,
        }
      },
      scales:{
        y:{min:0, beginAtZero:true, grace:0, bounds:'ticks', grid:{color:'rgba(0,0,0,0.05)'}, ticks:{font:{size:12,weight:'600'}}},
        x:{
          grid:{display:false},
          ticks:{
            font:{size:11,weight:'600'},
            maxTicksLimit:8,
            maxRotation:45,
            autoSkip:true,
            // 空白末尾點不顯示標籤
            callback(val, idx, ticks){
              const label = this.getLabelForValue(val);
              return label || '';
            }
          },
        },
      }
    }
  });
  chartInstances.set(canvasId, newChart);

  // ── 水平拖曳軸 ──
  addChartRangeSlider(canvasId, newChart, labels);
  // 滑桿加入容器後再做一次完整 layout，確保基準線與資料點使用相同的 Canvas 尺寸。
  requestAnimationFrame(() => { newChart.resize(); newChart.update('none'); });
}
